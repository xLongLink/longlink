# Apply these boundaries before installing shared controllers.
apiVersion: v1
kind: Namespace
metadata:
    name: knative-serving
---
apiVersion: v1
kind: Namespace
metadata:
    name: kourier-system
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: longlink-gateway-boundary
    namespace: kourier-system
spec:
    podSelector: {}
    policyTypes: [Ingress]
    ingress:
        # Probers need both the internal and dedicated probe listeners, never tenant sources.
        - from:
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: knative-serving
                podSelector:
                    matchLabels:
                        app: net-kourier-controller
          ports:
              - {protocol: TCP, port: 8081}
              - {protocol: TCP, port: 8090}
              - {protocol: TCP, port: 9443}
        # Only operator-labelled Platform Pods may enter from inside the cluster.
        - from:
              - namespaceSelector:
                    matchLabels:
                        longlink.io/platform: 'true'
                podSelector:
                    matchLabels:
                        longlink.io/component: api
          ports:
              - {protocol: TCP, port: 8444}
        # External Platform sources require a separate operator-owned IP allowlist policy.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: longlink-activator-boundary
    namespace: knative-serving
spec:
    podSelector:
        matchLabels:
            app: activator
    policyTypes: [Ingress]
    ingress:
        - from:
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: kourier-system
                podSelector:
                    matchLabels:
                        app: 3scale-kourier-gateway
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: knative-serving
          ports:
              - {protocol: TCP, port: 8012}
              - {protocol: TCP, port: 8013}
              - {protocol: TCP, port: 9090}
