apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
    - https://github.com/knative/serving/releases/download/knative-v1.23.0/serving-core.yaml
patches:
    # CRDs have a separate release so they are established before Serving starts.
    - target:
          kind: CustomResourceDefinition
      patch: |-
          $patch: delete
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata:
              name: separate-release
    # Shared namespaces belong to the bootstrap stage, not individual Helm releases.
    - patch: |-
          $patch: delete
          apiVersion: v1
          kind: Namespace
          metadata:
              name: knative-serving
    - patch: |-
          apiVersion: v1
          kind: ConfigMap
          metadata:
              name: config-network
              namespace: knative-serving
          data:
              ingress-class: kourier.ingress.networking.knative.dev
    - patch: |-
          apiVersion: v1
          kind: ConfigMap
          metadata:
              name: config-features
              namespace: knative-serving
          data:
              kubernetes.podspec-nodeselector: enabled
              kubernetes.podspec-securitycontext: enabled
              kubernetes.podspec-volumes-emptydir: enabled
              secure-pod-defaults: enabled
    - patch: |-
          apiVersion: v1
          kind: ConfigMap
          metadata:
              name: config-deployment
              namespace: knative-serving
          data:
              queue-sidecar-cpu-request: 25m
              queue-sidecar-cpu-limit: 200m
              queue-sidecar-memory-request: 64Mi
              queue-sidecar-memory-limit: 128Mi
              queue-sidecar-ephemeral-storage-request: 64Mi
              queue-sidecar-ephemeral-storage-limit: 128Mi
    - target:
          kind: MutatingWebhookConfiguration
          name: webhook.serving.knative.dev
      patch: |-
          - op: remove
            path: /webhooks/0/rules
    - target:
          kind: ValidatingWebhookConfiguration
          name: validation.webhook.serving.knative.dev
      patch: |-
          - op: remove
            path: /webhooks/0/rules
