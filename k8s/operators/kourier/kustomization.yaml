apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
    - release.yml
patches:
    # Shared namespaces belong to the bootstrap stage, not individual Helm releases.
    - patch: |-
          $patch: delete
          apiVersion: v1
          kind: Namespace
          metadata:
              name: kourier-system
    - target:
          kind: ConfigMap
          name: config-kourier
      patch: |-
          - op: add
            path: /data/cluster-cert-secret
            value: longlink-gateway-tls
    - target:
          kind: Deployment
          name: 3scale-kourier-gateway
      patch: |-
          - op: replace
            path: /spec/template/spec/containers/0/image
            value: docker.io/envoyproxy/envoy@sha256:ea33a83e4bb1b34b9345f1d98930af9c70d19a0ee1680d9ff087789636fdbc34
    - target:
          kind: Service
          name: kourier
      patch: |-
          - op: replace
            path: /spec/ports
            value:
              - name: https
                port: 443
                targetPort: 8444
                protocol: TCP
          - op: add
            path: /spec/externalTrafficPolicy
            value: Local
