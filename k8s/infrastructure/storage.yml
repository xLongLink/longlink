apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
    name: rook-ceph
    namespace: rook-ceph
spec:
    cephVersion:
        image: quay.io/ceph/ceph:v19.2.6@sha256:ff836bb28e7d0be0ec4dd22e79407174452a96e11ee62e9cdd1fa47f4bcc3bdc
        allowUnsupported: false
    dataDirHostPath: /var/lib/rook
    mon:
        count: 3
        allowMultiplePerNode: false
        volumeClaimTemplate:
            spec:
                storageClassName: block-storage
                resources:
                    requests:
                        storage: 10Gi
    mgr:
        count: 2
        allowMultiplePerNode: false
    dashboard:
        enabled: false
    storage:
        useAllNodes: false
        useAllDevices: false
        storageClassDeviceSets:
            - name: longlink
              count: 3
              resources: {}
              placement:
                  topologySpreadConstraints:
                      - maxSkew: 1
                        topologyKey: kubernetes.io/hostname
                        whenUnsatisfiable: DoNotSchedule
                        labelSelector:
                            matchLabels:
                                app: rook-ceph-osd
              volumeClaimTemplates:
                  - metadata:
                        name: data
                    spec:
                        storageClassName: block-storage
                        volumeMode: Block
                        accessModes: [ReadWriteOnce]
                        resources:
                            requests:
                                storage: 100Gi
---
apiVersion: ceph.rook.io/v1
kind: CephObjectStore
metadata:
    name: longlink
    namespace: rook-ceph
spec:
    metadataPool:
        failureDomain: host
        replicated:
            size: 3
            requireSafeReplicaSize: true
    dataPool:
        failureDomain: host
        replicated:
            size: 3
            requireSafeReplicaSize: true
    preservePoolsOnDelete: true
    gateway:
        instances: 2
        port: 0
        securePort: 443
        sslCertificateRef: longlink-storage-tls
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
    name: longlink-buckets
provisioner: rook-ceph.ceph.rook.io/bucket
reclaimPolicy: Delete
parameters:
    objectStoreName: longlink
    objectStoreNamespace: rook-ceph
---
apiVersion: ceph.rook.io/v1
kind: CephObjectStoreUser
metadata:
    name: longlink-health
    namespace: rook-ceph
spec:
    store: longlink
    quotas:
        maxBuckets: -1
    opMask:
        - read
