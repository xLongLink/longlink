apiVersion: v1
kind: Service
metadata:
    name: rustfs-svc
    namespace: rustfs
spec:
    ports:
        - name: endpoint
          port: 9000
    selector:
        app.kubernetes.io/name: rustfs
---
apiVersion: v1
kind: Service
metadata:
    name: rustfs-headless
    namespace: rustfs
spec:
    clusterIP: None
    publishNotReadyAddresses: true
    ports:
        - name: endpoint
          port: 9000
    selector:
        app.kubernetes.io/name: rustfs
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: rustfs
    namespace: rustfs
spec:
    serviceName: rustfs-headless
    replicas: 4
    podManagementPolicy: Parallel
    selector:
        matchLabels:
            app.kubernetes.io/name: rustfs
    template:
        metadata:
            labels:
                app.kubernetes.io/name: rustfs
        spec:
            automountServiceAccountToken: false
            enableServiceLinks: false
            securityContext:
                fsGroup: 10001
                runAsGroup: 10001
                runAsUser: 10001
            affinity:
                podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        - weight: 100
                          podAffinityTerm:
                              labelSelector:
                                  matchExpressions:
                                      - key: app.kubernetes.io/name
                                        operator: In
                                        values: [rustfs]
                              topologyKey: kubernetes.io/hostname
            containers:
                - name: rustfs
                  image: {{ .Values.rustfs.image.repository }}:{{ .Values.rustfs.image.tag }}
                  imagePullPolicy: IfNotPresent
                  command: ["/usr/bin/rustfs"]
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop: [ALL]
                      readOnlyRootFilesystem: true
                      runAsNonRoot: true
                  ports:
                      - {name: endpoint, containerPort: 9000}
                  env:
                      - name: RUSTFS_ADDRESS
                        value: ":9000"
                      - name: RUSTFS_OBS_LOG_DIRECTORY
                        value: "/logs"
                      - name: RUSTFS_OBS_LOGGER_LEVEL
                        value: "info"
                      - name: RUSTFS_OBS_ENVIRONMENT
                        value: "production"
                      - name: RUSTFS_VOLUMES
                        value: "http://rustfs-{0...3}.rustfs-headless.rustfs.svc.cluster.local:9000/data"
                      - name: RUSTFS_CHART_POD_NAME
                        valueFrom: {fieldRef: {fieldPath: metadata.name}}
                      - name: RUSTFS_LOCAL_ENDPOINT_HOST
                        value: "$(RUSTFS_CHART_POD_NAME).rustfs-headless.rustfs.svc.cluster.local"
                  envFrom:
                      - secretRef:
                            name: longlink-rustfs
                  livenessProbe:
                      httpGet: {path: /health, port: 9000}
                      initialDelaySeconds: 30
                      periodSeconds: 5
                      timeoutSeconds: 3
                      successThreshold: 1
                      failureThreshold: 3
                  readinessProbe:
                      httpGet: {path: /health/ready, port: 9000}
                      initialDelaySeconds: 10
                      periodSeconds: 5
                      timeoutSeconds: 3
                      successThreshold: 1
                      failureThreshold: 3
                  volumeMounts:
                      - {name: data, mountPath: /data}
                      - {name: logs, mountPath: /logs}
            volumes:
                - name: logs
                  emptyDir: {}
    volumeClaimTemplates:
        - metadata: {name: data}
          spec:
              accessModes: [ReadWriteOnce]
              storageClassName: {{ .Values.rustfs.storage.name }}
              resources:
                  requests:
                      storage: {{ .Values.rustfs.storage.dataStorageSize }}
