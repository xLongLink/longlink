apiVersion: v1
kind: ConfigMap
metadata:
    name: longlink-storage-proxy
    namespace: rustfs
data:
    nginx.conf: |
        pid /tmp/nginx.pid;
        error_log /dev/stderr;
        events {}
        http {
            access_log /dev/stdout;
            client_body_temp_path /tmp/client_temp;
            proxy_temp_path /tmp/proxy_temp;
            fastcgi_temp_path /tmp/fastcgi_temp;
            uwsgi_temp_path /tmp/uwsgi_temp;
            scgi_temp_path /tmp/scgi_temp;
            include /etc/nginx/conf.d/default.conf;
        }
    default.conf: |
        server {
            listen 8443 ssl;
            ssl_certificate /etc/nginx/tls/tls.crt;
            ssl_certificate_key /etc/nginx/tls/tls.key;
            client_max_body_size 0;
            proxy_request_buffering off;
            location ^~ /rustfs/admin {
                return 404;
            }
            location / {
                proxy_pass http://rustfs-svc.rustfs.svc.cluster.local:9000;
                proxy_set_header Host $http_host;
                proxy_set_header X-Forwarded-Proto https;
            }
        }
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: longlink-storage
    namespace: rustfs
spec:
    replicas: 2
    selector:
        matchLabels:
            app.kubernetes.io/name: longlink-storage
    template:
        metadata:
            labels:
                app.kubernetes.io/name: longlink-storage
        spec:
            automountServiceAccountToken: false
            securityContext:
                runAsUser: 101
                runAsGroup: 101
                runAsNonRoot: true
                fsGroup: 101
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: nginx
                  image: {{ .Values.storage.image.repository }}:{{ .Values.storage.image.tag }}
                  command: ["nginx"]
                  args: ["-c", "/etc/nginx/conf.d/nginx.conf", "-g", "daemon off;"]
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop: [ALL]
                      readOnlyRootFilesystem: true
                  resources:
{{ toYaml .Values.storage.resources | indent 22 }}
                  ports:
                      - containerPort: 8443
                        name: https
                  volumeMounts:
                      - name: configuration
                        mountPath: /etc/nginx/conf.d
                        readOnly: true
                      - name: tls
                        mountPath: /etc/nginx/tls
                        readOnly: true
                      - name: temporary
                        mountPath: /tmp
            volumes:
                - name: configuration
                  configMap:
                      name: longlink-storage-proxy
                - name: tls
                  secret:
                      secretName: longlink-storage-tls
                      defaultMode: 0440
                - name: temporary
                  emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
    name: longlink-storage
    namespace: rustfs
{{- with .Values.storage.service.annotations }}
    annotations:
{{ toYaml . | indent 8 }}
{{- end }}
spec:
    type: {{ .Values.storage.service.type }}
{{- if eq .Values.storage.service.type "LoadBalancer" }}
    loadBalancerIP: {{ .Values.storage.address }}
{{- end }}
{{- with .Values.storage.service.loadBalancerClass }}
    loadBalancerClass: {{ . }}
{{- end }}
    ports:
        - name: https
          port: 443
          targetPort: https
{{- with .Values.storage.service.nodePort }}
          nodePort: {{ . }}
{{- end }}
    selector:
        app.kubernetes.io/name: longlink-storage
