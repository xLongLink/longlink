apiVersion: v1
kind: ConfigMap
metadata:
    name: longlink-storage-proxy
    namespace: rustfs
data:
    default.conf: |
        server {
            listen 443 ssl;
            ssl_certificate /etc/nginx/tls/tls.crt;
            ssl_certificate_key /etc/nginx/tls/tls.key;
            client_max_body_size 0;
            proxy_request_buffering off;
            location / {
                proxy_pass http://rustfs-svc.rustfs.svc.cluster.local:9000;
                proxy_set_header Host $http_host;
                proxy_set_header X-Forwarded-Proto https;
            }
        }
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: longlink-storage
    namespace: rustfs
spec:
    replicas: 2
    selector:
        matchLabels:
            app.kubernetes.io/name: longlink-storage
    template:
        metadata:
            labels:
                app.kubernetes.io/name: longlink-storage
        spec:
            containers:
                - name: nginx
                  image: nginx:1.29.1-alpine
                  ports:
                      - containerPort: 443
                        name: https
                  volumeMounts:
                      - name: configuration
                        mountPath: /etc/nginx/conf.d
                        readOnly: true
                      - name: tls
                        mountPath: /etc/nginx/tls
                        readOnly: true
            volumes:
                - name: configuration
                  configMap:
                      name: longlink-storage-proxy
                - name: tls
                  secret:
                      secretName: longlink-storage-tls
---
apiVersion: v1
kind: Service
metadata:
    name: longlink-storage
    namespace: rustfs
{{- with .Values.storage.service.annotations }}
    annotations:
{{ toYaml . | indent 8 }}
{{- end }}
spec:
    type: {{ .Values.storage.service.type }}
    externalTrafficPolicy: Cluster
{{- if eq .Values.storage.service.type "LoadBalancer" }}
    loadBalancerIP: {{ .Values.storage.address }}
{{- end }}
{{- with .Values.storage.service.loadBalancerClass }}
    loadBalancerClass: {{ . }}
{{- end }}
    ports:
        - name: https
          port: 443
          targetPort: https
{{- with .Values.storage.service.nodePort }}
          nodePort: {{ . }}
{{- end }}
    selector:
        app.kubernetes.io/name: longlink-storage
