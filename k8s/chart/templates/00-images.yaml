{{/* Require immutable images for the shared storage data plane. */}}
{{- range $name := list "storage" "rustfs" -}}
{{- $image := (index $.Values $name).image -}}
{{- $reference := printf "%s:%s" $image.repository ($image.tag | default "") -}}
{{- if not (regexMatch "^[^@[:space:]]+@sha256:[a-f0-9]{64}$" $reference) -}}
{{- fail (printf "%s.image.tag must include an immutable @sha256: digest with 64 lowercase hexadecimal characters" $name) -}}
{{- end -}}
{{- end -}}
