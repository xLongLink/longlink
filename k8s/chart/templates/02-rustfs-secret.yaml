{{/* Generate administrator credentials once with Helm's CSPRNG. The lookup skips rendering while
the Secret exists, and resource-policy keep preserves it across upgrades and uninstalls. */}}
{{- $existingSecret := lookup "v1" "Secret" "rustfs" "longlink-rustfs" }}
{{- if not $existingSecret }}
apiVersion: v1
kind: Secret
metadata:
    name: longlink-rustfs
    namespace: rustfs
    annotations:
        helm.sh/resource-policy: keep
type: Opaque
stringData:
    RUSTFS_ACCESS_KEY: {{ randAlphaNum 20 | quote }}
    RUSTFS_SECRET_KEY: {{ randAlphaNum 32 | quote }}
{{- end }}
