{{/* Generate administrator credentials once with Helm's CSPRNG when no explicit keys are configured.
The lookup skips rendering while the Secret exists, and resource-policy keep preserves it across
upgrades and uninstalls, so the credentials stay stable. */}}
{{- $existingSecret := lookup "v1" "Secret" "rustfs" "longlink-rustfs" }}
{{- if not $existingSecret }}
apiVersion: v1
kind: Secret
metadata:
    name: longlink-rustfs
    namespace: rustfs
    annotations:
        helm.sh/resource-policy: keep
type: Opaque
stringData:
    RUSTFS_ACCESS_KEY: {{ .Values.rustfs.secret.accessKey | default (randAlphaNum 20) | quote }}
    RUSTFS_SECRET_KEY: {{ .Values.rustfs.secret.secretKey | default (randAlphaNum 32) | quote }}
{{- end }}
