services:
    registry:
        image: registry:3
        restart: unless-stopped
        ports:
            - '127.0.0.1:15000:5000'
            - '${LONGLINK_DEV_GATEWAY:?Run development services through make up}:15000:5000'
        networks:
            - longlink

networks:
    longlink:
        name: longlink-dev
        external: true
