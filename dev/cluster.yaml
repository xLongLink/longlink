apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
    name: compute
servers: 1
image: rancher/k3s:v1.34.3-k3s1@sha256:c63773f3549c09ac5f79f57ae3b057118e7de394b3ae84cd9faf68a1be872ae5
subnet: 172.30.0.0/24
kubeAPI:
    hostIP: 127.0.0.1
    hostPort: '8001'
ports:
    - port: 127.0.0.1:8443:30443
      nodeFilters:
          - server:0
    - port: 127.0.0.1:9443:30943
      nodeFilters:
          - server:0
registries:
    create:
        name: longlink-registry
        host: 127.0.0.1
        hostPort: '15000'
    config: |
        mirrors:
            'localhost:15000':
                endpoint:
                    - 'http://longlink-registry:5000'
volumes:
    # systemd-resolved's loopback stub is not reachable from k3d containers.
    - volume: /run/systemd/resolve:/run/systemd/resolve:ro
      nodeFilters:
          - server:0
options:
    k3d:
        wait: true
    k3s:
        extraArgs:
            - arg: --resolv-conf=/run/systemd/resolve/resolv.conf
              nodeFilters:
                  - server:0
            - arg: --disable=traefik
              nodeFilters:
                  - server:0
