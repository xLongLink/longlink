apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: longlink-local-gateway
    namespace: kourier-system
spec:
    podSelector:
        matchLabels:
            app: 3scale-kourier-gateway
    policyTypes: [Ingress]
    ingress:
        # Match the fixed k3d subnet, outside the Pod network.
        - from:
              - ipBlock:
                    cidr: 172.30.0.0/24
          ports:
              - protocol: TCP
                port: 8444
