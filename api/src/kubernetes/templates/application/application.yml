# Template for one desired LongLink Application workload.
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: $application_id
    namespace: '$namespace'
spec:
    # Stop the running version before its replacement applies schema migrations.
    strategy:
        type: Recreate
    selector:
        matchLabels:
            $application_id_label: $application_id
    template:
        metadata:
            annotations:
                longlink.io/runtime-revision: '$runtime_revision'
            labels:
                $application_id_label: $application_id
        spec:
            automountServiceAccountToken: false
            securityContext:
                runAsNonRoot: true
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: application
                  image: $image
                  resources:
                      requests:
                          cpu: 100m
                          memory: 128Mi
                      limits:
                          cpu: 500m
                          memory: 256Mi
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: 8000
                      periodSeconds: 5
                      failureThreshold: 3
                  envFrom:
                      - secretRef:
                            name: $application_id
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop:
                              - ALL
                      readOnlyRootFilesystem: true
                  volumeMounts:
                      - name: tmp
                        mountPath: /tmp
            volumes:
                - name: tmp
                  emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
    name: app-$application_id
    namespace: '$namespace'
spec:
    type: ClusterIP
    selector:
        $application_id_label: $application_id
    ports:
        - port: 8000
