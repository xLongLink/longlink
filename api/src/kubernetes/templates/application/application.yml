# Template for one desired LongLink Application workload.
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: $application_id
    namespace: $namespace
spec:
    strategy:
        type: Recreate
    selector:
        matchLabels:
            longlink.io/application-id: $application_id
    template:
        metadata:
            labels:
                longlink.io/application-id: $application_id
        spec:
            automountServiceAccountToken: false
            securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                fsGroup: 10001
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: application
                  image: $image
                  ports:
                      - name: http
                        containerPort: 8000
                  startupProbe:
                      httpGet: &health-check
                          path: /health
                          port: http
                      periodSeconds: 2
                      failureThreshold: 60
                  readinessProbe:
                      httpGet: *health-check
                      periodSeconds: 5
                      failureThreshold: 3
                  envFrom:
                      - secretRef:
                            name: $application_id
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop:
                              - ALL
                      readOnlyRootFilesystem: true
                  volumeMounts:
                      - name: tmp
                        mountPath: /tmp
            volumes:
                - name: tmp
                  emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
    name: app-$application_id
    namespace: $namespace
spec:
    selector:
        longlink.io/application-id: $application_id
    ports:
        - name: http
          port: 8000
          targetPort: http
