# Template for one desired LongLink Application workload.
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: $application_id
    namespace: $namespace
spec:
    selector:
        matchLabels:
            $application_id_label: $application_id
    template:
        metadata:
            labels:
                $application_id_label: $application_id
        spec:
            automountServiceAccountToken: false
            securityContext:
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: application
                  image: $image
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: 8000
                      periodSeconds: 5
                      failureThreshold: 3
                  envFrom:
                      - secretRef:
                             name: $environment_secret_name
                      - secretRef:
                             name: $runtime_secret_name
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop:
                              - ALL
                      readOnlyRootFilesystem: true
                  volumeMounts:
                      - name: tmp
                        mountPath: /tmp
            volumes:
                - name: tmp
                  emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
    name: $service_name
    namespace: $namespace
spec:
    selector:
        $application_id_label: $application_id
    ports:
        - port: 8000
