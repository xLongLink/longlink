# Template for one desired LongLink Application workload.
---
apiVersion: batch/v1
kind: Job
metadata:
    name: $migration_id
    namespace: '$namespace'
    labels:
        $application_id_label: $application_id
        longlink.io/component: migration
spec:
    backoffLimit: 0
    template:
        metadata:
            labels:
                $application_id_label: $application_id
                longlink.io/component: migration
        spec:
            automountServiceAccountToken: false
            restartPolicy: Never
            securityContext:
                runAsNonRoot: true
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: migration
                  image: $image
                  command:
                      - python
                      - -c
                      - from longlink.database.migrations import apply_migrations; apply_migrations()
                  resources:
                      requests:
                          cpu: 100m
                          memory: 128Mi
                      limits:
                          cpu: 500m
                          memory: 256Mi
                  envFrom:
                      - secretRef:
                            name: $application_id
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop:
                              - ALL
                      readOnlyRootFilesystem: true
                  volumeMounts:
                      - name: tmp
                        mountPath: /tmp
            volumes:
                - name: tmp
                  emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: $application_id
    namespace: '$namespace'
spec:
    # Stop the running version before its replacement applies schema migrations.
    strategy:
        type: Recreate
    selector:
        matchLabels:
            $application_id_label: $application_id
    template:
        metadata:
            annotations:
                longlink.io/runtime-revision: '$runtime_revision'
            labels:
                $application_id_label: $application_id
        spec:
            automountServiceAccountToken: false
            securityContext:
                runAsNonRoot: true
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: application
                  image: $image
                  resources:
                      requests:
                          cpu: 100m
                          memory: 128Mi
                      limits:
                          cpu: 500m
                          memory: 256Mi
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: 8000
                      periodSeconds: 5
                      failureThreshold: 3
                  envFrom:
                      - secretRef:
                            name: $application_id
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop:
                              - ALL
                      readOnlyRootFilesystem: true
                  volumeMounts:
                      - name: tmp
                        mountPath: /tmp
            volumes:
                - name: tmp
                  emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
    name: app-$application_id
    namespace: '$namespace'
spec:
    selector:
        $application_id_label: $application_id
    ports:
        - port: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: $application_id
    namespace: '$namespace'
spec:
    parentRefs:
        - name: longlink
          namespace: longlink-system
          sectionName: https
    rules:
        - matches:
              - headers:
                    - name: x-longlink-application-id
                      value: $application_id
          filters:
              - type: RequestHeaderModifier
                requestHeaderModifier:
                    remove:
                        - x-longlink-application-id
          backendRefs:
              - name: app-$application_id
                port: 8000
