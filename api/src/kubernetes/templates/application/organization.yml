# Template for one owned organization Namespace and gateway ingress policy.
---
apiVersion: v1
kind: Namespace
metadata:
    name: $namespace
    labels:
        longlink.io/organization-id: '$organization_id'
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: longlink-gateway-ingress
    namespace: $namespace
    labels:
        longlink.io/organization-id: '$organization_id'
spec:
    podSelector: {}
    policyTypes:
        - Ingress
    ingress:
        - from:
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: longlink-system
                podSelector:
                    matchLabels:
                        app: longlink-gateway
