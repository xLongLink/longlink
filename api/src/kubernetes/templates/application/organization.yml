# Template for one owned Organization Namespace, quota, and network boundary.
---
apiVersion: v1
kind: Namespace
metadata:
    name: '$namespace'
---
apiVersion: v1
kind: ResourceQuota
metadata:
    name: longlink-applications
    namespace: '$namespace'
spec:
    hard:
        limits.cpu: '2'
        limits.ephemeral-storage: 2Gi
        limits.memory: 1Gi
        pods: '4'
        requests.cpu: 400m
        requests.ephemeral-storage: 1Gi
        requests.memory: 512Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: longlink-application-network-boundary
    namespace: '$namespace'
spec:
    podSelector: {}
    policyTypes:
        - Ingress
        - Egress
    ingress:
        - from:
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: envoy-gateway-system
                podSelector:
                    matchLabels:
                        gateway.envoyproxy.io/owning-gateway-name: longlink
                        gateway.envoyproxy.io/owning-gateway-namespace: longlink-system
          ports:
              - protocol: TCP
                port: 8000
    egress:
        # Permit DNS resolution without granting access to other cluster services.
        - to:
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: kube-system
                podSelector:
                    matchLabels:
                        k8s-app: kube-dns
          ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
        # Permit public IPv4 destinations while excluding private, link-local, and reserved networks.
        - to:
              - ipBlock:
                    cidr: 0.0.0.0/0
                    except:
                        - 0.0.0.0/8
                        - 10.0.0.0/8
                        - 100.64.0.0/10
                        - 127.0.0.0/8
                        - 169.254.0.0/16
                        - 172.16.0.0/12
                        - 192.0.0.0/24
                        - 192.168.0.0/16
                        - 198.18.0.0/15
                        - 224.0.0.0/4
                        - 240.0.0.0/4
        # Apply the equivalent boundary to IPv6 workloads.
        - to:
              - ipBlock:
                    cidr: ::/0
                    except:
                        - ::1/128
                        - ::ffff:0:0/96
                        - fc00::/7
                        - fe80::/10
