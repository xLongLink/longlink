# Template for one desired LongLink Solution workload.
---
apiVersion: batch/v1
kind: Job
metadata:
    name: $migration_id
    namespace: '$namespace'
    labels:
        $solution_id_label: $solution_id
        longlink.io/component: migration
spec:
    backoffLimit: 0
    suspend: false
    template:
        metadata:
            labels:
                $solution_id_label: $solution_id
                longlink.io/component: migration
        spec:
            automountServiceAccountToken: false
            restartPolicy: Never
            nodeSelector:
                kubernetes.io/os: linux
                kubernetes.io/arch: amd64
            securityContext:
                runAsNonRoot: true
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: migration
                  image: $image
                  command:
                      - python
                      - -m
                      - longlink.database.migrations
                  resources:
                      requests:
                          cpu: 100m
                          ephemeral-storage: 256Mi
                          memory: 128Mi
                      limits:
                          cpu: 500m
                          ephemeral-storage: 512Mi
                          memory: 256Mi
                  envFrom:
                      - secretRef:
                            name: $secret_id
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop:
                              - ALL
                      readOnlyRootFilesystem: true
                  volumeMounts:
                      - name: tmp
                        mountPath: /tmp
            volumes:
                - name: tmp
                  emptyDir:
                      sizeLimit: 256Mi
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
    name: solution-$solution_id
    namespace: '$namespace'
    labels:
        $solution_id_label: $solution_id
        networking.knative.dev/visibility: cluster-local
spec:
    template:
        metadata:
            annotations:
                longlink.io/runtime-revision: '$runtime_revision'
                autoscaling.knative.dev/min-scale: '$min_scale'
                autoscaling.knative.dev/max-scale: '2'
                autoscaling.knative.dev/scale-to-zero-pod-retention-period: '1m'
            labels:
                $solution_id_label: $solution_id
                longlink.io/component: solution
        spec:
            containerConcurrency: 80
            timeoutSeconds: 300
            automountServiceAccountToken: false
            nodeSelector:
                kubernetes.io/os: linux
                kubernetes.io/arch: amd64
            securityContext:
                runAsNonRoot: true
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: solution
                  image: $image
                  ports:
                      - containerPort: 8000
                        name: http1
                  resources:
                      requests:
                          cpu: 100m
                          ephemeral-storage: 256Mi
                          memory: 128Mi
                      limits:
                          cpu: 500m
                          ephemeral-storage: 512Mi
                          memory: 256Mi
                  startupProbe:
                      httpGet:
                          path: /health
                          port: 8000
                      periodSeconds: 5
                      failureThreshold: 60
                  livenessProbe:
                      httpGet:
                          path: /health
                          port: 8000
                      periodSeconds: 10
                      failureThreshold: 3
                  readinessProbe:
                      httpGet:
                          path: /ready
                          port: 8000
                      timeoutSeconds: 5
                      periodSeconds: 5
                      failureThreshold: 3
                  envFrom:
                      - secretRef:
                            name: $secret_id
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop:
                              - ALL
                      readOnlyRootFilesystem: true
                  volumeMounts:
                      - name: tmp
                        mountPath: /tmp
            volumes:
                - name: tmp
                  emptyDir:
                      sizeLimit: 256Mi
