# Template for one desired LongLink Solution workload.
---
apiVersion: batch/v1
kind: Job
metadata:
    name: $migration_id
    namespace: '$namespace'
    labels:
        $solution_id_label: $solution_id
        longlink.io/component: migration
spec:
    backoffLimit: 0
    template:
        metadata:
            labels:
                $solution_id_label: $solution_id
                longlink.io/component: migration
        spec:
            automountServiceAccountToken: false
            restartPolicy: Never
            securityContext:
                runAsNonRoot: true
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: migration
                  image: $image
                  command:
                      - python
                      - -m
                      - longlink.database.migrations
                  resources:
                      requests:
                          cpu: 100m
                          ephemeral-storage: 256Mi
                          memory: 128Mi
                      limits:
                          cpu: 500m
                          ephemeral-storage: 512Mi
                          memory: 256Mi
                  envFrom:
                      - secretRef:
                            name: $solution_id
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop:
                              - ALL
                      readOnlyRootFilesystem: true
                  volumeMounts:
                      - name: tmp
                        mountPath: /tmp
            volumes:
                - name: tmp
                  emptyDir:
                      sizeLimit: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: $solution_id
    namespace: '$namespace'
spec:
    # Replace the previous runtime only after this revision's migration succeeds.
    strategy:
        type: Recreate
    selector:
        matchLabels:
            $solution_id_label: $solution_id
    template:
        metadata:
            annotations:
                longlink.io/runtime-revision: '$runtime_revision'
            labels:
                $solution_id_label: $solution_id
        spec:
            automountServiceAccountToken: false
            securityContext:
                runAsNonRoot: true
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: solution
                  image: $image
                  resources:
                      requests:
                          cpu: 100m
                          ephemeral-storage: 256Mi
                          memory: 128Mi
                      limits:
                          cpu: 500m
                          ephemeral-storage: 512Mi
                          memory: 256Mi
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: 8000
                      periodSeconds: 5
                      failureThreshold: 3
                  envFrom:
                      - secretRef:
                            name: $solution_id
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop:
                              - ALL
                      readOnlyRootFilesystem: true
                  volumeMounts:
                      - name: tmp
                        mountPath: /tmp
            volumes:
                - name: tmp
                  emptyDir:
                      sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
    name: solution-$solution_id
    namespace: '$namespace'
spec:
    selector:
        $solution_id_label: $solution_id
    ports:
        - port: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: $solution_id
    namespace: '$namespace'
spec:
    parentRefs:
        - name: longlink
          namespace: longlink-system
          sectionName: https
    rules:
        - matches:
              - headers:
                    - name: x-longlink-solution-id
                      value: $solution_id
          filters:
              - type: RequestHeaderModifier
                requestHeaderModifier:
                    remove:
                        - x-longlink-solution-id
          backendRefs:
              - name: solution-$solution_id
                port: 8000
