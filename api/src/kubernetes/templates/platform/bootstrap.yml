# Stable per-compute gateway endpoint resources.
apiVersion: v1
kind: Namespace
metadata:
    name: longlink-system
---
apiVersion: v1
kind: Service
metadata:
    name: longlink-gateway
    namespace: longlink-system
    labels:
        app: longlink-gateway
spec:
    type: LoadBalancer
    selector:
        app: longlink-gateway
    ports:
        - port: 443
          targetPort: 8443
