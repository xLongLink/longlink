# Template for the per-compute Envoy gateway runtime.
apiVersion: v1
kind: ConfigMap
metadata:
    name: longlink-gateway
    namespace: longlink-system
data:
    envoy.yaml: $envoy_config
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: longlink-gateway
    namespace: longlink-system
    labels:
        app: longlink-gateway
spec:
    replicas: 1
    selector:
        matchLabels:
            app: longlink-gateway
    template:
        metadata:
            annotations:
                longlink.io/config-revision: '$config_revision'
            labels:
                app: longlink-gateway
        spec:
            automountServiceAccountToken: false
            securityContext:
                runAsNonRoot: true
                runAsUser: 101
                runAsGroup: 101
                fsGroup: 101
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: longlink-gateway
                  image: envoyproxy/envoy:v1.38.2@sha256:af7c3dfdbe10de65cb2db5839ce1adf8904ee41c9d372076d62acab43af6ec41
                  args:
                      - -c
                      - /etc/envoy/envoy.yaml
                  startupProbe:
                      tcpSocket:
                          port: 8443
                      periodSeconds: 2
                      failureThreshold: 60
                  readinessProbe:
                      tcpSocket:
                          port: 8443
                      periodSeconds: 5
                  livenessProbe:
                      tcpSocket:
                          port: 8443
                  volumeMounts:
                      - name: config
                        mountPath: /etc/envoy
                        readOnly: true
                      - name: tls
                        mountPath: /etc/envoy-tls
                  resources:
                      requests:
                          cpu: 100m
                          memory: 128Mi
                      limits:
                          cpu: 500m
                          memory: 256Mi
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop:
                              - ALL
                      readOnlyRootFilesystem: true
            volumes:
                - name: config
                  configMap:
                      name: longlink-gateway
                - name: tls
                  secret:
                      secretName: longlink-gateway-tls
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: longlink-gateway-ingress
    namespace: longlink-system
    labels:
        app: longlink-gateway
spec:
    podSelector:
        matchLabels:
            app: longlink-gateway
    policyTypes:
        - Ingress
    ingress:
        - ports:
              - port: 8443
