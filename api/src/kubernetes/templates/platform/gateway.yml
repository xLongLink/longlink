# LongLink requires Envoy Gateway v1.8 and owns one authenticated Gateway per Compute.
apiVersion: v1
kind: Namespace
metadata:
    name: longlink-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
    name: longlink-envoy
spec:
    controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
    name: longlink
    namespace: longlink-system
spec:
    gatewayClassName: longlink-envoy
    listeners:
        - name: https
          protocol: HTTPS
          port: 443
          tls:
              mode: Terminate
              certificateRefs:
                  - group: ''
                    kind: Secret
                    name: longlink-gateway-tls
          allowedRoutes:
              namespaces:
                  from: All
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
    name: longlink-api-only
    namespace: longlink-system
spec:
    targetRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: longlink
    apiKeyAuth:
        credentialRefs:
            - group: ''
              kind: Secret
              name: longlink-gateway-api-key
        extractFrom:
            - headers:
                  - x-longlink-api-key
