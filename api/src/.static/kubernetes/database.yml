apiVersion: v1
kind: Namespace
metadata:
    name: '$namespace'
    labels:
        longlink.io/compute-namespace: '$compute_namespace'
---
apiVersion: v1
kind: ResourceQuota
metadata:
    name: longlink-database
    namespace: '$namespace'
spec:
    hard:
        # Budget one instance, its bootstrap/join Job, and one backup/replacement Pod.
        pods: '3'
        requests.cpu: '3'
        requests.memory: '3Gi'
        limits.cpu: '3'
        limits.memory: '3Gi'
        persistentvolumeclaims: '2'
        requests.storage: '${quota_storage_mib}Mi'
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: longlink-database-boundary
    namespace: '$namespace'
spec:
    podSelector: {}
    policyTypes: [Ingress]
    ingress:
        - from:
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: '$compute_namespace'
                podSelector:
                    matchExpressions:
                        - key: longlink.io/component
                          operator: In
                          values: [solution, migration]
              - namespaceSelector:
                    matchLabels:
                        longlink.io/platform: 'true'
                podSelector:
                    matchLabels:
                        longlink.io/component: api
          ports:
              - { protocol: TCP, port: 5432 }
        - from:
              - podSelector:
                    matchLabels:
                        cnpg.io/cluster: database
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: cnpg-system
          ports:
              - { protocol: TCP, port: 5432 }
              - { protocol: TCP, port: 8000 }
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
    name: database
    namespace: '$namespace'
spec:
    instances: 1
    enableSuperuserAccess: true
    superuserSecret:
        name: database-superuser
    storage:
        storageClass: $storage_class
        size: '${size_mib}Mi'
    resources:
        requests:
            cpu: 250m
            memory: 256Mi
        limits:
            cpu: '1'
            memory: 1Gi
    postgresql:
        pg_hba:
            - hostnossl all all all reject
