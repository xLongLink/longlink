[build-system]
requires = ['setuptools>=83.0.0', 'setuptools_scm[toml]>=10.2.1']
build-backend = 'setuptools.build_meta'

[project]
name = 'longlink-api'
dynamic = ['version']
description = 'LongLink backend API'
readme = 'README.md'
requires-python = '>=3.12'
dependencies = [
    'aioboto3>=15.5.0',
    'aiomysql>=0.3.2',
    'aiosmtplib>=5.1.2',
    'aiosqlite>=0.22.1',
    'alembic>=1.18.5',
    'asyncpg>=0.31.0',
    'botocore>=1.40.61',
    'cryptography>=50.0.0',
    'email-validator>=2.3.0',
    'exoscale>=0.16.3',
    'fastapi>=0.141.1',
    'httpx2>=2.9.1',
    'packaging>=26.0',
    'pydantic>=2.13.4',
    'pydantic-settings>=2.14.2',
    'pyyaml>=6.0.3',
    'pwdlib[argon2]>=0.3.0,<1',
    'pyjwt>=2.10.1,<3',
    'python-slugify>=8.0.4',
    'psycopg[binary]>=3.3.4',
    'sqlalchemy>=2.0.51',
    'sqlalchemy-utils>=0.42.1',
    'sqlmodel>=0.0.39',
    'kr8s>=0.20.15',
    'longlink',
    'uvicorn>=0.52.1',
    'mjml>=0.12.0',
]

[tool.uv.sources]
longlink = { path = "../sdk", editable = true }
exoscale = { git = "https://github.com/xLongLink/python-exoscale", rev = "7a1ed139e8d535b150505506450dba72efa1314e" }

[project.optional-dependencies]
dev = [
    'ty>=0.0.65',
    'ruff>=0.16.1',
    'pytest>=9.0.3',
    'pytest-asyncio>=1.4.0',
    'docker>=7.2.0',
    'types-aiobotocore-s3==3.9.0',
]

[tool.setuptools_scm]
version_scheme = 'no-guess-dev'
local_scheme = 'no-local-version'
fallback_version = '0.0.0'

[tool.setuptools]
py-modules = ['main']

[tool.setuptools.packages.find]
include = ['src*']

[tool.setuptools.package-data]
"src.kubernetes.templates" = ["application/*.yml", "platform/*.yml"]
"src.utils" = ["templates/*.mjml"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["UP", "D300", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D300"]
"src/database/models/*.py" = ["UP037", "UP045"]

[tool.ruff.lint.isort]
no-sections = true
length-sort = true

[tool.ty.environment]
extra-paths = ["../sdk"]

[tool.ty.src]
include = ["main.py", "seed.py", "src", "alembic"]
# Keep SQLModel descriptor diagnostics out of the gate while still checking
# callers and non-ORM API code.
exclude = ["src/.static", "tests", "src/database/models", "src/database/services"]

[tool.pytest.ini_options]
pythonpath = [".", "../sdk"]
markers = [
    "integration: marks tests requiring container-backed infrastructure",
    "no_db: skips the API test database fixture for pure unit tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
