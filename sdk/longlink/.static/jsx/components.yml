    - name: MenuItem.label
      type: string
      description: Navigation label; its lowercase, hyphenated form identifies the
        item's URL fragment.

    - name: MenuSubSection.children
      type: ReactNode
      description: MenuItem elements nested inside this collapsible group.

    - name: MenuSubSection.icon
      type: "'close' | 'chevronDown' | 'chevronLeft' | 'chevronRight' | 'chevronsLeft'
        | 'chevronsRight' | 'check' | 'success' | 'error' | 'warning' | 'info' |
        'calendar' | 'clock' | 'externalLink' | 'menu' | 'moreHorizontal' |
        'refresh' | 'search' | 'arrowUp' | 'arrowDown' | 'arrowsUpDown' |
        'boxes' | 'building2' | 'database' | 'funnel' | 'eyeSlash' |
        'viewColumns' | 'copy' | 'checkDouble' | 'wrench' | 'stop' |
        'microphone' | 'logs' | 'trash' | 'hardDrive' | 'userRound' | 'users'"
      description: Optional LongLink icon name displayed beside the group label.

    - name: MenuSubSection.label
      type: string
      description: Label displayed on the collapsible navigation group.


- name: MetadataList
