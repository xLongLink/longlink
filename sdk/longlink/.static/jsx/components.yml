- name: Avatar
  category: Display
  introduction: Uses local Waves fallbacks for rounded organization avatars and
    Glyphs for users.
  properties:
    - name: shape
      type: '"circle" | "rounded" | "square"'
      description: "Shape variant of the avatar. 'circle' stays fully round. 'rounded'
        uses the element radius token so it matches UI corner rounding and can
        be set globally via theme. 'square' has no radius. Status dot
        positioning adapts automatically: 4-o'clock on circle, bottom-right
        corner on rounded/square."
      default: circle

    - name: name
      type: string
      description: User name for initials and alt text.

    - name: seed
      type: string
      description: Stable identity for generated avatars, independent of the display name.

    - name: kind
      type: '"user" | "organization"'
      description: Organization owners use rounded Waves avatars; user owners retain
        the supplied geometry or a circle.

    - name: src
      type: string | null
      description: Primary image source URL.

    - name: alt
      type: string
      description: Alt text (falls back to name).

    - name: size
      type: '"sm" | "md" | "lg"'
      description: Avatar size. Use a named size or a numeric pixel value. Avatar
        shares Icon's abbreviated scale, but its tiers are larger because
        avatars align with media rather than glyphs. Inside an AvatarGroup the
        group's size wins and this prop is ignored.
      default: md


- name: Badge
  category: Display
  introduction: Displays a count or enumerated state.
  properties:
    - name: label
      type: ReactNode
      description: Badge text content. A badge is one line, so a label wider than the
        space available is cut with an ellipsis rather than escaping its
        container; a string or number label is also set as the badge's title so
        the full text stays reachable on hover.

    - name: icon
      type: "'close' | 'chevronDown' | 'chevronLeft' | 'chevronRight' | 'chevronsLeft'
        | 'chevronsRight' | 'check' | 'success' | 'error' | 'warning' | 'info' |
        'calendar' | 'clock' | 'externalLink' | 'menu' | 'moreHorizontal' |
        'refresh' | 'search' | 'arrowUp' | 'arrowDown' | 'arrowsUpDown' |
        'boxes' | 'building2' | 'database' | 'funnel' | 'eyeSlash' |
        'viewColumns' | 'copy' | 'checkDouble' | 'wrench' | 'stop' |
        'microphone' | 'logs' | 'trash' | 'hardDrive' | 'userRound' | 'users'"
      description: Optional leading icon.

    - name: variant
      type: '"success" | "error" | "warning" | "info" | "neutral" | "blue" | "cyan" |
        "green" | "orange" | "pink" | "purple" | "red" | "teal" | "yellow"'
      description: Visual style variant. Semantic variants (neutral, info, success,
        warning, error) use solid backgrounds. Non-semantic color variants use
        tinted backgrounds with colored text for categorization and tagging.
      default: neutral


- name: Button
  category: Action
  introduction: Gives onClick automatic asynchronous loading and duplicate-click prevention.
  properties:
    - name: label
      type: string
      description: Visible button text and accessible label.

    - name: variant
      type: '"primary" | "secondary" | "ghost" | "destructive"'
      description: Visual style variant.
      default: secondary

    - name: size
      type: '"sm" | "md" | "lg"'
      description: Size variant.
      default: md

    - name: type
      type: '"button" | "submit" | "reset"'
      description: HTML button type attribute.
      default: button

    - name: name
      type: string
      description: HTML name attribute for form submission.

    - name: value
      type: string | number | readonly string[]
      description: HTML value attribute for form submission.

    - name: form
      type: string
      description: Associates the button with a form element by ID.

    - name: icon
      type: "'close' | 'chevronDown' | 'chevronLeft' | 'chevronRight' | 'chevronsLeft'
        | 'chevronsRight' | 'check' | 'success' | 'error' | 'warning' | 'info' |
        'calendar' | 'clock' | 'externalLink' | 'menu' | 'moreHorizontal' |
        'refresh' | 'search' | 'arrowUp' | 'arrowDown' | 'arrowsUpDown' |
        'boxes' | 'building2' | 'database' | 'funnel' | 'eyeSlash' |
        'viewColumns' | 'copy' | 'checkDouble' | 'wrench' | 'stop' |
        'microphone' | 'logs' | 'trash' | 'hardDrive' | 'userRound' | 'users'"
      description: Icon element rendered before the label text. An Astryx Icon with no
        explicit size defaults to sm for sm/md buttons and md for lg buttons.

    - name: endContent
      type: ReactNode
      description: Trailing icon or badge rendered after the label. Ignored when
        isIconOnly is true. Color is inherited from the button variant.

    - name: tooltip
      type: string
      description: Tooltip text shown on hover.

    - name: width
      type: string | number
      description: Width of the button. Numbers are treated as pixels, strings are
        used as-is (e.g., '100%' for a full-width button). By default the button
        sizes to its content, never grows past its container, and truncates its
        label with an ellipsis when a row is too narrow; icon-only buttons stay
        square.

    - name: disabled
      type: boolean
      description: The disabled prop.

    - name: href
      type: string
      description: Solution-relative destination or HTTP(S) URL to open in a new tab.

    - name: onClick
      type: "(event: ViewMouseEvent) => void | Promise<void>"
      description: Runs an action with automatic async loading and duplicate-click
        prevention until its promise settles.


- name: ButtonGroup
  category: Action
  introduction: Groups related flat action buttons.
  properties:
    - name: children
      type: ReactNode
      description: Button or IconButton children.

    - name: label
      type: string
      description: Accessible label for the group (aria-label).

    - name: orientation
      type: '"horizontal" | "vertical"'
      description: Layout direction of the button group.
      default: horizontal

    - name: size
      type: '"sm" | "md" | "lg"'
      description: Default size for buttons in the group. Individual buttons can override.
      default: md

    - name: isDisabled
      type: boolean
      description: Whether all buttons in the group are disabled.
      default: false


- name: Card
  category: Layouts
  introduction: ""
  properties:
    - name: children
      type: ReactNode
      description: Content rendered inside the card.

    - name: padding
      type: 0 | 0.5 | 1 | 1.5 | 2 | 3 | 4 | 5 | 6 | 8 | 10
      description: Inner spacing using the theme spacing scale.
      default: 4

    - name: variant
      type: '"blue" | "cyan" | "green" | "orange" | "pink" | "purple" | "red" | "teal"
        | "yellow" | "default" | "transparent" | "muted" | "gray"'
      description: Background color variant, independent of the interaction mode.
      default: default

    - name: width
      type: string | number
      description: Card width; numbers are pixels and strings are CSS sizes.

    - name: height
      type: string | number
      description: Card height; numbers are pixels and strings are CSS sizes.

    - name: maxWidth
      type: string | number
      description: Maximum card width.

    - name: minHeight
      type: string | number
      description: Minimum card height.

    - name: inert
      type: boolean
      description: Makes the card and its descendants non-interactive.

    - name: aria-hidden
      type: boolean | "true" | "false"
      description: Hides the card from assistive technologies.

    - name: label
      type: string
      description: Accessible label for interactive cards; supply a descriptive label.
      default: Card

    - name: onClick
      type: "(event: ViewMouseEvent) => void"
      description: Makes the card clickable when its surface is activated; nested
        controls act independently.

    - name: href
      type: string
      description: Solution-relative destination or HTTP(S) URL to open in a new tab
        when no selection callback is supplied.

    - name: target
      type: string
      description: Native link target; isolated Views use the current Solution for
        relative paths and a new tab for HTTP(S) URLs.
      default: _self

    - name: isDisabled
      type: boolean
      description: Disables activation of an interactive card.
      default: false

    - name: isSelected
      type: boolean
      description: Selection state; supply onChange to let users toggle it.
      default: false

    - name: onChange
      type: "(isSelected: boolean) => void"
      description: Makes the card selectable and receives its next selection state;
        takes priority over onClick and href.


- name: CheckboxInput
  category: Form
  introduction: Edits a boolean or indeterminate field.
  properties:
    - name: label
      type: string
      description: Label text for the checkbox (always rendered for accessibility).

    - name: description
      type: string
      description: Description text displayed below the label.

    - name: name
      type: string
      description: Includes the themed control's value under this form submission name.

    - name: required
      type: boolean
      description: Requires a value before native form submission.

    - name: disabled
      type: boolean
      description: Prevents interaction and excludes the field from submission.

    - name: width
      type: string | number
      description: Width of the field (number = pixels, string used as-is, e.g.
        "100%"). Sizes the whole field (label, control, and status) so they stay
        aligned.

    - name: value
      type: boolean | "indeterminate"
      description: Whether the checkbox is checked, unchecked, or indeterminate.

    - name: defaultChecked
      type: boolean
      description: The defaultChecked prop.

    - name: onChange
      type: "(value: boolean) => void"
      description: Callback fired when the checkbox state changes.

    - name: size
      type: '"sm" | "md"'
      description: The size of the checkbox. sm for compact layouts, md for default.
      default: md


- name: CodeBlock
  category: Display
  introduction: Displays source code using standard copy and highlighting behavior.
  properties:
    - name: code
      type: string
      description: The code string to display.

    - name: language
      type: string
      description: Language for syntax highlighting. Use "plaintext" to disable.
      default: plaintext

    - name: title
      type: string
      description: Filename or label shown in the header bar.

    - name: isWrapped
      type: boolean
      description: Wrap long lines instead of enabling horizontal scroll.
      default: false


- name: Collapsible
  category: Layouts
  introduction: Shows or hides content using controlled or initially open state.
  properties:
    - name: children
      type: ReactNode
      description: Content that collapses and expands.

    - name: trigger
      type: ReactNode
      description: Content shown in the trigger area (always visible).

    - name: defaultIsOpen
      type: boolean
      description: Default open state (uncontrolled).
      default: true

    - name: isOpen
      type: boolean
      description: Controlled open state.

    - name: isDisabled
      type: boolean
      description: Disable the item so its trigger can't be toggled (dimmed,
        aria-disabled, and out of the tab order). Doesn't collapse an
        already-open item.
      default: false

    - name: onOpenChange
      type: "(isOpen: boolean) => void"
      description: Callback invoked when the open state changes.


- name: Currency
  category: Display
  introduction: ""
  properties:
    - name: value
      type: number
      description: Amount to format in currency units.

    - name: currency
      type: string
      description: ISO 4217 currency code, such as USD or CHF.

    - name: locale
      type: string
      description: Locale for formatting; omitted values use the viewer's locale.


- name: DateInput
  category: Form
  introduction: Selects a constrained date with standard month and week presentation.
  properties:
    - name: label
      type: string
      description: Label text.

    - name: description
      type: string
      description: Helper text displayed below the label.

    - name: name
      type: string
      description: Includes the themed control's value under this form submission name.

    - name: required
      type: boolean
      description: Requires a value before native form submission.

    - name: disabled
      type: boolean
      description: Prevents interaction and excludes the field from submission.

    - name: width
      type: string | number
      description: Width of the field (number = pixels, string used as-is, e.g.
        "100%"). Sizes the whole field (label, control, and status) so they stay
        aligned.

    - name: value
      type: "`${number}${number}${number}${number}-${number}${number}-${number}${numb\
        er}`"
      description: Selected date in YYYY-MM-DD format.

    - name: defaultValue
      type: "`${number}${number}${number}${number}-${number}${number}-${number}${numb\
        er}`"
      description: The defaultValue prop.

    - name: onChange
      type: "(value:
        `${number}${number}${number}${number}-${number}${number}-${number}${num\
        ber}` | undefined) => void"
      description: Callback invoked when the selected date changes.

    - name: min
      type: "`${number}${number}${number}${number}-${number}${number}-${number}${numb\
        er}`"
      description: Minimum selectable date (YYYY-MM-DD).

    - name: max
      type: "`${number}${number}${number}${number}-${number}${number}-${number}${numb\
        er}`"
      description: Maximum selectable date (YYYY-MM-DD).

    - name: dateConstraints
      type: "readonly ((date: Date) => boolean)[]"
      description: Additional constraints applied to the themed calendar picker.

    - name: placeholder
      type: string
      description: Placeholder text shown in the text input.
      default: Select a date

    - name: hasClear
      type: boolean
      description: Shows a clear (×) button when a date value is set. Clicking it
        clears the value and returns focus to the input.
      default: false

    - name: size
      type: '"sm" | "md" | "lg"'
      description: Size of the input control.
      default: md


- name: Dialog
  category: Layouts
  introduction: Displays an accessible modal with an explicit purpose and
    controlled visibility.
  properties:
    - name: children
      type: ReactNode
      description: Dialog content.

    - name: aria-label
      type: string
      description: The aria-label prop.

    - name: isOpen
      type: boolean
      description: Whether the dialog is open.

    - name: onOpenChange
      type: "(open: boolean) => void"
      description: Callback when dialog visibility changes.

    - name: purpose
      type: '"info" | "form" | "required"'
      description: "Controls dismissal behavior: required disables Escape and backdrop
        click; form disables backdrop click after interaction; info allows
        both."
      default: info

    - name: width
      type: string | number
      description: Preferred dialog width, clamped to the viewport.
      default: 400

    - name: height
      type: string | number
      description: Frame height; when set, short content is vertically centered while
        longer content scrolls.

    - name: maxHeight
      type: string | number
      description: Maximum dialog height within the View viewport.
      default: 75dvh

    - name: padding
      type: 0 | 0.5 | 1 | 1.5 | 2 | 3 | 4 | 5 | 6 | 8 | 10
      description: Content inset using the shared spacing scale.
      default: 4

    - name: contentWidth
      type: string | number
      description: Maximum width of the centered content column.


- name: Divider
  category: Display
  introduction: Separates View content with an optional label and configurable
    line presentation.
  properties:
    - name: label
      type: ReactNode
      description: Optional label centered on the divider.

    - name: variant
      type: '"subtle" | "strong"'
      description: Visual weight of the divider line.
      default: subtle

    - name: orientation
      type: '"horizontal" | "vertical"'
      description: Orientation of the divider.
      default: horizontal

    - name: isFullBleed
      type: boolean
      description: Extend the divider to container edges with negative margins.
      default: false


- name: DropdownMenu
  category: Action
  introduction: Opens an action menu using standard adaptive presentation and placement.
  properties:
    - name: button
      type: '{ label: string; variant?: "primary" | "secondary" | "ghost" |
        "destructive"; size?: "sm" | "md" | "lg"; isDisabled?: boolean; }'
      description: Props for the trigger button (Button props except onClick).
      default:
        label: Menu
        variant: secondary
        size: md
        isDisabled: false

    - name: items
      type: DropdownMenuOption[]
      description: "Array of menu entries. Each entry is one of: an action item
        `{label, onClick?, icon?, description?, endContent?, isDisabled?,
        variant?, hasCloseOnSelect?, id?}` (variant `\"destructive\"` renders it
        in the error color; `endContent` holds trailing content such as a
        keyboard-shortcut hint; `id` is the row's stable React key, needed only
        when the array reorders or filters), a divider `{type: \"divider\"}`, or
        a section `{type: \"section\", title?, id?, items: [...action items]}`."

    - name: isMenuOpen
      type: boolean
      description: Controlled open state for the menu. Mounting with true renders the
        menu open without moving focus into it; focus moves to the first item
        only when the menu opens after mount.

    - name: onOpenChange
      type: "(isOpen: boolean) => void"
      description: Callback fired when the open state changes.


- name: EmptyState
  category: Display
  introduction: Describes an empty View region without custom decorative slots.
  properties:
    - name: title
      type: string
      description: Primary message rendered as an <h3> heading inside the empty state.

    - name: isCompact
      type: boolean
      description: Enables the compact variant with reduced spacing for constrained
        content areas.
      default: false


- name: FileInput
  category: Form
  introduction: Selects files with explicit upload constraints; uploading remains
    a Solution operation.
  properties:
    - name: label
      type: string
      description: Accessible label for the file input.

    - name: description
      type: string
      description: Description text displayed between the label and input.

    - name: name
      type: string
      description: Includes the themed control's value under this form submission name.

    - name: required
      type: boolean
      description: Requires a value before native form submission.

    - name: disabled
      type: boolean
      description: Prevents interaction and excludes the field from submission.

    - name: width
      type: string | number
      description: Width of the field (number = pixels, string used as-is, e.g.
        "100%"). Sizes the whole field (label, control, and status) so they stay
        aligned.

    - name: value
      type: File | File[] | null
      description: Currently selected file(s). Controlled component.

    - name: onChange
      type: "(value: File | File[] | null) => void"
      description: Callback fired when files are selected or removed.

    - name: accept
      type: string
      description: Accepted file types. Uses the HTML accept attribute format (e.g.
        "image/*", ".pdf,.doc").

    - name: multiple
      type: boolean
      description: The multiple prop.

    - name: maxSize
      type: number
      description: Maximum file size in bytes. Files exceeding this are rejected with
        an error status.

    - name: maxFiles
      type: number
      description: Maximum number of files (only applies when isMultiple is true).

    - name: placeholder
      type: string
      description: Placeholder text shown when no file is selected.
      default: "(multiple ? 'Choose files' : 'Choose file')"

    - name: mode
      type: '"input" | "dropzone"'
      description: Visual mode. 'input' is a compact inline style; 'dropzone' is a
        larger area with drag-and-drop support.
      default: input


- name: FileViewer
  category: Display
  introduction: ""
  properties:
    - name: src
      type: string
      description: Scoped Solution operation path returning the file to preview.

    - name: title
      type: string
      description: Attachment name used for accessible action labels and the
        downloaded filename.


- name: Form
  category: Form
  introduction: ""
  properties:
    - name: children
      type: ReactNode
      description: Named controls, ordinary HTML fields, and layout components.

    - name: action
      type: string
      description: Solution-relative API path; external URLs are not supported.

    - name: method
      type: '"post"'
      description: Only POST is supported; defaults to post. Use request() for other
        methods.

    - name: id
      type: string
      description: Native form ID for associating external submit or reset buttons.

    - name: onSuccess
      type: "(data: ViewData) => void | Promise<void>"
      description: Runs after a successful write and automatic cached-data refresh.


- name: Functions
  category: Runtime
  members:

    - name: navigate(path)
      description: Navigates within the current Solution using a scoped path, or opens
        an HTTP(S) URL in a new tab. External URLs require user activation and
        open without an opener or referrer.

    - name: request(path, options)
      description: Requests a Solution operation and returns its data. Options support
        the HTTP method, JSON, form data, and binary responses. Requests and
        responses are limited to 2,000,000 bytes, with at most 32 form entries
        and 8 pending operations. Successful writes automatically refresh cached
        View data. Failed HTTP requests reject with an Error containing an
        optional numeric status and a bounded client-facing message.
  introduction: ""


- name: Grid
  category: Layouts
  introduction: Arranges View content into a fixed number of columns.
  properties:
    - name: children
      type: ReactNode
      description: Grid content.

    - name: columns
      type: number
      description: 'Column configuration. Use a number for fixed columns (e.g.
        `columns={3}`). Use an object for responsive columns: `minWidth` sets
        the minimum column width in px, `repeat` controls track behavior
        (`"fill"` preserves empty tracks for consistent widths, `"fit"`
        collapses empty tracks so items stretch; defaults to `"fill"`), and
        `max` caps the maximum number of columns.'
      default: 1

    - name: gap
      type: 0 | 0.5 | 1 | 1.5 | 2 | 3 | 4 | 5 | 6 | 8 | 10
      description: Spacing between all items.
      default: 3

    - name: GridSpan.children
      type: ReactNode
      description: Content rendered inside the grid item.

    - name: GridSpan.columns
      type: number | "full"
      description: Number of columns to occupy, or full to span the entire grid.
      default: 1


- name: Heading
  category: Display
  introduction: Displays a semantic View heading without a separate visual-level override.
  properties:
    - name: children
      type: ReactNode
      description: Heading content.

    - name: level
      type: 1 | 2 | 3 | 4 | 5 | 6
      description: Heading level. Determines the semantic HTML element (h1-h6) and the
        visual styling from the theme (unless `type` is set).
      default: 2


- name: Hooks
  category: Runtime
  members:

    - name: useState(initial)
      description: Returns the current state and a setter. Pass a value or an
        initializer function; updates can use the previous state.

    - name: useEffect(effect, dependencies)
      description: Synchronizes with external systems after rendering. Return a
        cleanup function to release timers or subscriptions. Include every
        reactive value used by the effect in its dependencies.

    - name: useMemo(factory, dependencies)
      description: Caches a calculated value until its dependencies change. Use it for
        expensive calculations, not required application state.

    - name: useRef(initial)
      description: Returns a stable object with a mutable current property. Changing
        current does not trigger a render.

    - name: useApi(path)
      description: Returns Solution data and an awaitable invalidator scoped to the
        full request path. The renderer handles initial loading, errors, and
        retry.
  introduction: ""


- name: Icon
  category: Display
  introduction: Renders a registered Lucide icon at the requested Astryx size.
  properties:
    - name: icon
      type: "'close' | 'chevronDown' | 'chevronLeft' | 'chevronRight' | 'chevronsLeft'
        | 'chevronsRight' | 'check' | 'success' | 'error' | 'warning' | 'info' |
        'calendar' | 'clock' | 'externalLink' | 'menu' | 'moreHorizontal' |
        'refresh' | 'search' | 'arrowUp' | 'arrowDown' | 'arrowsUpDown' |
        'boxes' | 'building2' | 'database' | 'funnel' | 'eyeSlash' |
        'viewColumns' | 'copy' | 'checkDouble' | 'wrench' | 'stop' |
        'microphone' | 'logs' | 'trash' | 'hardDrive' | 'userRound' | 'users'"
      description: "Semantic icon name or SVG component. Valid semantic names: close,
        chevronDown, chevronLeft, chevronRight, chevronsLeft, chevronsRight,
        check, success, error, warning, info, calendar, clock, externalLink,
        menu, moreHorizontal, search, arrowUp, arrowDown, arrowsUpDown, funnel,
        eyeSlash, viewColumns, copy, checkDouble, wrench, stop, microphone. For
        any icon not in this list, pass an SVG component directly (e.g. import
        from lucide-react or @heroicons/react). Note: this prop is called
        `icon`, not `name`."

    - name: size
      type: '"sm" | "md" | "lg"'
      description: Icon size. An explicit value wins. When omitted, Icon uses the
        nearest default supplied by an owning Astryx component for its icon
        slot, then falls back to md when no contextual default exists.


- name: IconButton
  category: Action
  introduction: Runs a labeled icon action with automatic async feedback.
  properties:
    - name: label
      type: string
      description: Accessible label. Used as aria-label (not rendered as visible text).

    - name: icon
      type: "'close' | 'chevronDown' | 'chevronLeft' | 'chevronRight' | 'chevronsLeft'
        | 'chevronsRight' | 'check' | 'success' | 'error' | 'warning' | 'info' |
        'calendar' | 'clock' | 'externalLink' | 'menu' | 'moreHorizontal' |
        'refresh' | 'search' | 'arrowUp' | 'arrowDown' | 'arrowsUpDown' |
        'boxes' | 'building2' | 'database' | 'funnel' | 'eyeSlash' |
        'viewColumns' | 'copy' | 'checkDouble' | 'wrench' | 'stop' |
        'microphone' | 'logs' | 'trash' | 'hardDrive' | 'userRound' | 'users'"
      description: Icon element rendered inside the button. An Astryx Icon with no
        explicit size defaults to sm for sm/md buttons and md for lg buttons.

    - name: variant
      type: '"primary" | "secondary" | "ghost" | "destructive"'
      description: Visual style variant.
      default: secondary

    - name: size
      type: '"sm" | "md" | "lg"'
      description: Size variant.
      default: md

    - name: tooltip
      type: string
      description: Tooltip text shown on hover.

    - name: isDisabled
      type: boolean
      description: Disables the button.
      default: false

    - name: onClick
      type: "(event: ViewMouseEvent) => void | Promise<void>"
      description: Standard click handler.


- name: Link
  category: Action
  introduction: Navigates within the Solution or opens an external HTTP(S) URL in a new tab.
  properties:
    - name: to
      type: string
      description: The to prop.

    - name: children
      type: ReactNode
      description: Link content


- name: Menu
  category: Layouts
  introduction: ""
  properties:
    - name: children
      type: ReactNode
      description: MenuSection elements defining navigation and content.

    - name: gap
      type: 0 | 0.5 | 1 | 1.5 | 2 | 3 | 4 | 5 | 6 | 8 | 10
      default: 3

    - name: MenuSection.children
      type: ReactNode
