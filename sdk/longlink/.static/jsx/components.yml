    - name: columns
      type: number | "multi" | "single"
      description: Column layout mode.
      default: single

    - name: title
      type: ReactNode
      description: Optional title or heading above the list.

    - name: MetadataListItem.children
      type: ReactNode
      description: Value rendered beside the metadata label.

    - name: MetadataListItem.label
      type: string
      description: Label identifying the metadata value.

    - name: MetadataListItem.icon
      type: "'close' | 'chevronDown' | 'chevronLeft' | 'chevronRight' | 'chevronsLeft'
        | 'chevronsRight' | 'check' | 'success' | 'error' | 'warning' | 'info' |
        'calendar' | 'clock' | 'externalLink' | 'menu' | 'moreHorizontal' |
        'refresh' | 'search' | 'arrowUp' | 'arrowDown' | 'arrowsUpDown' |
        'boxes' | 'building2' | 'database' | 'funnel' | 'eyeSlash' |
        'viewColumns' | 'copy' | 'checkDouble' | 'wrench' | 'stop' |
        'microphone' | 'logs' | 'trash' | 'hardDrive' | 'userRound' | 'users'"
      description: Optional icon displayed beside the metadata label.


- name: MoreMenu
  category: Action
  introduction: Opens additional actions without exposing popup geometry or
    presentation modes.
  properties:
    - name: items
      type: DropdownMenuOption[]
      description: "Menu items: data array of actions, dividers, and sections. Same
        type as DropdownMenu items prop."

    - name: label
      type: string
      description: Accessible label for the trigger button (aria-label) and tooltip text.
      default: More options

    - name: icon
      type: "'close' | 'chevronDown' | 'chevronLeft' | 'chevronRight' | 'chevronsLeft'
        | 'chevronsRight' | 'check' | 'success' | 'error' | 'warning' | 'info' |
        'calendar' | 'clock' | 'externalLink' | 'menu' | 'moreHorizontal' |
        'refresh' | 'search' | 'arrowUp' | 'arrowDown' | 'arrowsUpDown' |
        'boxes' | 'building2' | 'database' | 'funnel' | 'eyeSlash' |
        'viewColumns' | 'copy' | 'checkDouble' | 'wrench' | 'stop' |
        'microphone' | 'logs' | 'trash' | 'hardDrive' | 'userRound' | 'users'"
      description: Override the default three-dot icon. Accepts any ReactNode.

    - name: isDisabled
      type: boolean
      description: Whether the menu trigger is disabled.
      default: false

    - name: onOpenChange
      type: "(isOpen: boolean) => void"
      description: Callback fired when the menu opens or closes.


- name: MultiSelector
  category: Form
  introduction: Selects multiple values using standard option and selected-value rendering.
  properties:
    - name: label
      type: string
      description: Label text for accessibility.

    - name: description
      type: string
      description: Helper text displayed below the label.

    - name: name
      type: string
      description: Includes the themed control's value under this form submission name.

    - name: required
      type: boolean
      description: Requires a value before native form submission.

    - name: disabled
      type: boolean
      description: Prevents interaction and excludes the field from submission.

    - name: width
      type: string | number
      description: Width of the field (number = pixels, string used as-is, e.g.
        "100%"). Sizes the whole field (label, control, and status) so they stay
        aligned.

    - name: options
      type: SelectorOptionType[]
      description: "Array of items: strings, objects with value/label/icon/disabled,
        dividers, or sections."

    - name: value
      type: string[]
      description: Currently selected values.

    - name: defaultValue
      type: string[]
      description: The defaultValue prop.

    - name: onChange
      type: "(value: string[]) => void"
      description: Callback fired when the selection changes.

    - name: placeholder
      type: string
      description: Placeholder text shown when no value is selected.
      default: Select...

    - name: size
      type: '"sm" | "md" | "lg"'
      description: Size variant for the selector.
      default: md

    - name: hasSelectAll
      type: boolean
      description: Whether to show a select-all checkbox.
      default: false

    - name: hasSearch
      type: boolean
      description: 'Whether to show a search input for filtering options. As the user
        types, the match count (or "No results found") is announced to screen
        readers via a polite live region. The search field has built-in
        affordances: a leading magnifier icon and, once a query is typed, a
        trailing clear (✕) button that resets the query and returns focus to the
        input.'
      default: false

    - name: hasClear
      type: boolean
      description: Shows a clear button when values are selected.
      default: false


- name: NumberInput
  category: Form
  introduction: Edits a constrained number without wheel editing or custom value formatting.
  properties:
    - name: label
      type: string
      description: Label text for the input (always rendered for accessibility).

    - name: description
      type: string
      description: Description text displayed between the label and input.

    - name: name
      type: string
      description: Includes the themed control's value under this form submission name.

    - name: required
      type: boolean
      description: Requires a value before native form submission.

    - name: disabled
      type: boolean
      description: Prevents interaction and excludes the field from submission.

    - name: width
      type: string | number
      description: Width of the field (number = pixels, string used as-is, e.g.
        "100%"). Sizes the whole field (label, control, and status) so they stay
        aligned.

    - name: value
      type: number | null
      description: Current value of the input.

    - name: defaultValue
      type: number
      description: The defaultValue prop.

    - name: min
      type: number | null
      description: Minimum value allowed. A smaller entry commits at this value on
        blur or Enter.

    - name: max
      type: number | null
      description: Maximum value allowed. A larger entry commits at this value on blur
        or Enter.

    - name: step
      type: number | null
      description: Step increment for the input.
      default: 1

    - name: placeholder
      type: string
      description: Placeholder text.

    - name: size
      type: '"sm" | "md" | "lg"'
      description: Size variant.
      default: md

    - name: units
      type: string | null
      description: Units text to display at the end of the input (e.g., "%" or "GB").

    - name: isIntegerOnly
      type: boolean
      description: Only allow integer values (no floating point).
      default: false

    - name: autoComplete
      type: string
      description: HTML autocomplete attribute.

    - name: hasClear
      type: (false) | (true)
      description: Shows a clear (×) button when the input has a value. When true, the
        onChange callback also accepts null to signal the user cleared the
        input.
      default: false

    - name: onChange
      type: "((value: number) => void) | ((value: number | null) => void)"
      description: Callback fired when a valid text edit commits on blur or Enter, or
        when a step or clear control changes the value.


- name: ProgressBar
  category: Display
  introduction: Displays determinate progress with a semantic state.
  properties:
    - name: label
      type: string
      description: accessible label

    - name: value
      type: number
      description: Current value (ignored when indeterminate).
      default: 0

    - name: max
      type: number
      description: Maximum value.
      default: 100

    - name: hasValueLabel
      type: boolean
      description: Show formatted value text (ignored when indeterminate).
      default: false

    - name: variant
      type: '"success" | "error" | "warning" | "neutral" | "accent"'
      description: Semantic color variant.
      default: accent


- name: RadioList
  category: Form
  introduction: Selects one of a small number of labeled values.
  properties:
    - name: label
      type: string
      description: Label text for the radio group (always rendered for accessibility).

    - name: description
      type: string
      description: Description text displayed below the label.

    - name: name
      type: string
      description: Includes the themed control's value under this form submission name.

    - name: required
      type: boolean
      description: Requires a value before native form submission.

    - name: disabled
      type: boolean
      description: Prevents interaction and excludes the field from submission.

    - name: width
      type: string | number
      description: Width of the field (number = pixels, string used as-is, e.g.
        "100%"). Sizes the whole field (label, control, and status) so they stay
        aligned.

    - name: children
      type: ReactNode
      description: RadioListItem elements.

    - name: value
      type: string
      description: The currently selected value.

    - name: defaultValue
      type: string
      description: The defaultValue prop.

    - name: onChange
      type: "(value: string) => void"
      description: Callback fired when the selected value changes.

    - name: orientation
      type: '"horizontal" | "vertical"'
      description: Layout direction of the radio items.
      default: vertical

    - name: size
      type: '"sm" | "md"'
      description: Size of the radio controls.
      default: md

    - name: RadioListItem.label
      type: string
      description: Visible label identifying this choice.

    - name: RadioListItem.value
      type: string
      description: Value passed to the surrounding RadioList when selected.

    - name: RadioListItem.description
      type: string
      description: Optional helper text explaining the choice.

    - name: RadioListItem.isDisabled
      type: boolean
      default: false


- name: Selector
  category: Form
  introduction: Selects one value without custom option rendering or popup geometry.
  properties:
    - name: label
      type: string
      description: Label text for accessibility.

    - name: description
      type: string
      description: Helper text displayed below the label.

    - name: name
      type: string
      description: Includes the themed control's value under this form submission name.

    - name: required
      type: boolean
      description: Requires a value before native form submission.

    - name: disabled
      type: boolean
      description: Prevents interaction and excludes the field from submission.

    - name: width
      type: string | number
      description: Width of the field (number = pixels, string used as-is, e.g.
        "100%"). Sizes the whole field (label, control, and status) so they stay
        aligned.

    - name: options
      type: SelectorOptionType[]
      description: 'Array of items: strings, objects with
        value/label/description/icon/disabled, dividers ({type: "divider"}), or
        sections ({type: "section", title, options}).'

    - name: defaultValue
      type: string
      description: The defaultValue prop.

    - name: hasSearch
      type: boolean
      description: 'Whether to show a search input for filtering options. As the user
        types, the match count (or "No results found") is announced to screen
        readers via a polite live region. The search field has built-in
        affordances: a leading magnifier icon and, once a query is typed, a
        trailing clear (✕) button that resets the query and returns focus to the
        input.'
      default: false

    - name: placeholder
      type: string
      description: Placeholder text shown when no value is selected.
      default: Select...

    - name: size
      type: '"sm" | "md" | "lg"'
      description: Size variant for the selector.
      default: md

    - name: hasClear
      type: (false) | (true)
      description: Shows a clear (×) button when a value is selected. When true,
        onChange also accepts null to signal the user cleared the selection.
      default: false

    - name: value
      type: (string) | (string | null)
      description: Currently selected value.

    - name: onChange
      type: "((value: string) => void) | ((value: string | null) => void)"
      description: Callback fired when the selection changes.


- name: Slider
  category: Form
  introduction: Edits a number or range using a standard horizontal slider.
  properties:
    - name: label
      type: string
      description: Label text (always rendered for accessibility).

    - name: description
      type: string
      description: Description text rendered below the label.

    - name: name
      type: string
      description: Includes the themed control's value under this form submission name.

    - name: required
      type: boolean
      description: Requires a value before native form submission.

    - name: disabled
      type: boolean
      description: Prevents interaction and excludes the field from submission.

    - name: width
      type: string | number
      description: Width of the field (number = pixels, string used as-is, e.g.
        "100%"). Sizes the whole field (label, control, and status) so they stay
        aligned.

    - name: min
      type: number
      description: Minimum value.
      default: 0

    - name: max
      type: number
      description: Maximum value.
      default: 100

    - name: step
      type: number
      description: Step increment.
      default: 1

    - name: value
      type: (number) | ([number, number])
      description: "Current value: a `number` for single thumb mode or `[number,
        number]` for range mode."

    - name: defaultValue
      type: (number) | ([number, number])
      description: The defaultValue prop.

    - name: onChange
      type: "((value: number) => void) | ((value: [number, number]) => void)"
      description: Callback fired on value change during drag.

    - name: onChangeEnd
      type: "((value: number) => void) | ((value: [number, number]) => void)"
      description: Callback fired when drag ends.

    - name: minStepsBetweenThumbs
      type: number
      description: Minimum number of steps between thumbs in range mode; prevents
        thumbs from overlapping.
      default: 0


- name: Stack
  category: Layouts
  introduction: Arranges View content using the LongLink spacing scale.
  properties:
    - name: children
      type: ReactNode
      description: Stack content.

    - name: gap
      type: 0 | 0.5 | 1 | 1.5 | 2 | 3 | 4 | 5 | 6 | 8 | 10
      description: Spacing between items.
      default: 3

    - name: padding
      type: 0 | 0.5 | 1 | 1.5 | 2 | 3 | 4 | 5 | 6 | 8 | 10
      description: Inner padding on all sides, using the spacing scale. Pass as a JSX
        number expression e.g. padding={3}.
      default: 0

    - name: direction
      type: '"horizontal" | "vertical"'
      description: "Direction of the stack layout. 'horizontal' flows items
        left-to-right (like HStack), 'vertical' flows top-to-bottom (like
        VStack). Note: the value is 'horizontal', NOT 'row'."
      default: vertical

    - name: justify
      type: '"start" | "center" | "end" | "between" | "around" | "evenly"'
      description: "Main-axis alignment alias. Resolves to hAlign (horizontal) or
        vAlign (vertical). Note: use 'between', NOT 'space-between'."
      default: start

    - name: align
      type: '"start" | "center" | "end" | "stretch"'
      description: Cross-axis alignment alias. Mirrors CSS align-items.
      default: stretch

    - name: wrap
      type: '"nowrap" | "wrap" | "wrap-reverse"'
      description: Flex wrap behavior.
      default: nowrap

    - name: StackItem.children
      type: ReactNode
      description: Content rendered inside the stack item.

    - name: StackItem.size
      type: '"static" | "fill"'
      default: static

    - name: StackItem.isScrollable
      type: boolean
      default: false

    - name: StackItem.crossAlignSelf
      type: '"start" | "center" | "end" | "stretch"'
      description: Overrides this item's cross-axis alignment; omitted values inherit
        the parent alignment.


- name: StatusDot
  category: Display
  introduction: Displays a labeled semantic status without custom indicator rendering.
  properties:
    - name: label
      type: string
      description: Accessible label surfaced via aria-label.

    - name: variant
      type: '"success" | "error" | "warning" | "neutral" | "accent"'
      description: Semantic color variant.

    - name: tooltip
      type: string
      description: Tooltip text shown on hover to explain the status meaning.


- name: Stepper
  category: Layouts
  introduction: Displays the current step using standard progress indicators.
  properties:
    - name: children
      type: ReactNode
      description: Step elements to render in the stepper.

    - name: activeStep
      type: number
      description: Zero-based index of the currently active step. Steps before this
        index are marked as completed.
      default: 0

    - name: orientation
      type: '"horizontal" | "vertical"'
      description: Layout direction of the stepper.
      default: horizontal

    - name: Step.step
      type: number
      description: Zero-based index of this step in the process.

    - name: Step.label
      type: string
      description: Visible label identifying the step.


- name: Switch
  category: Form
  introduction: Edits an on/off setting using one controlled change handler.
  properties:
    - name: label
      type: string
      description: Label text for the switch (always rendered for accessibility).

    - name: description
      type: string
      description: Description text displayed below the label.

    - name: name
      type: string
      description: Includes the themed control's value under this form submission name.

    - name: required
      type: boolean
      description: Requires a value before native form submission.

    - name: disabled
      type: boolean
      description: Prevents interaction and excludes the field from submission.

    - name: width
      type: string | number
      description: Width of the field (number = pixels, string used as-is, e.g.
        "100%"). Sizes the whole field (label, control, and status) so they stay
        aligned.

    - name: value
      type: boolean
      description: Whether the switch is on or off.

    - name: defaultChecked
      type: boolean
      description: The defaultChecked prop.

    - name: onChange
      type: "(value: boolean) => void"
      description: Callback fired when the switch state changes.

    - name: size
      type: '"sm" | "md"'
      description: Size variant controlling track and thumb dimensions. sm matches sm
        checkbox/radio vertical rhythm; md matches md checkbox/radio vertical
        rhythm.
      default: md


- name: Table
  category: Display
  introduction: Displays data-driven rows without plugins or a second
    children-based table contract.
  properties:
    - name: data
      type: T[]
      description: Array of data items to render as rows. T must extend Record<string,
        unknown> (use `interface MyRow extends Record<string, unknown>` for
        custom types).

    - name: idKey
      type: "(keyof T & string) | ((row: T) => string | number)"
      description: Row key for React reconciliation. Pass a property name string or a
        function. Falls back to row index if omitted.

    - name: density
      type: '"compact" | "balanced" | "spacious"'
      description: Row density controlling cell padding and font size.
      default: balanced

    - name: hasHover
      type: boolean
      description: Applies a hover highlight background to rows on pointer devices.
      default: false

    - name: isStriped
      type: boolean
      description: Applies a background wash to even-numbered rows.
      default: false

    - name: columns
      type: '{ key: string; header?: ReactNode; width?: ColumnWidth; align?: "start" |
        "center" | "end"; renderCell?: ((row: T) => ReactNode); }[]'
      description: "Column definitions: each column has {key, header, width?, align?,
        renderCell?}. The `header` field sets the column heading text. If
        omitted, columns are auto-generated from data object keys. The `width`
        field is typed as `ColumnWidth` (not a number); use `proportional(n)` or
        `pixel(n)` helpers imported from `@astryxdesign/core/Table`. Example:
        `width: pixel(120)` for 120px fixed, `width: proportional(1)` for flex
        distribution."


- name: Tabs
  category: Layouts
  introduction: ""
  properties:
    - name: children
      type: ReactNode
      description: Tab elements defining labels and panel content.

    - name: gap
      type: 0 | 0.5 | 1 | 1.5 | 2 | 3 | 4 | 5 | 6 | 8 | 10
      default: 3

    - name: hasDivider
      type: boolean
      default: false

    - name: onChange
      type: "(value: string) => void"
      description: Receives the selected Tab value; use with value to control selection.

    - name: value
      type: string
      description: Selected Tab value; omit for internal selection, initially choosing
        the first tab.

    - name: Tab.children
      type: ReactNode
      description: Panel content mounted only while this tab is selected.

    - name: Tab.value
      type: string
      description: Unique value identifying this tab.

    - name: Tab.label
      type: string
      description: Visible tab label and accessible panel name.

    - name: Tab.isDisabled
      type: boolean
      description: Whether the tab is disabled.


- name: Text
  category: Display
  introduction: Displays View text with a small set of semantic styles.
  properties:
    - name: children
      type: ReactNode
      description: Text content.

    - name: color
      type: '"primary" | "secondary"'
      description: Text color. Defaults to 'secondary' for the 'supporting' type,
        'primary' for all others. Themes may add custom colors.
      default: "(props.type === 'supporting' ? 'secondary' : 'primary')"

    - name: type
      type: '"body" | "large" | "label" | "supporting" | "code"'
      description: "Semantic text type. Determines size, weight, and line-height from
        the theme. 'inherit' takes all three from the surrounding text instead.
        Themes may add custom types. Note: this prop is called `type`, not
        `variant`."
      default: body


- name: TextArea
  category: Form
  introduction: Edits themed multi-line text with native form serialization.
  properties:
    - name: label
      type: string
      description: Label text for the textarea. Always rendered for accessibility.

    - name: description
      type: string
      description: Helper text displayed between the label and textarea.

    - name: name
      type: string
      description: Includes the themed control's value under this form submission name.

    - name: required
      type: boolean
      description: Requires a value before native form submission.

    - name: disabled
      type: boolean
      description: Prevents interaction and excludes the field from submission.

    - name: width
      type: string | number
      description: Width of the field (number = pixels, string used as-is, e.g.
        "100%"). Sizes the whole field (label, control, and status) so they stay
        aligned.

    - name: value
      type: string
      description: Current value of the textarea.

    - name: defaultValue
      type: string
      description: The defaultValue prop.

    - name: onChange
      type: "(value: string) => void"
      description: Callback fired when the textarea value changes.

    - name: placeholder
      type: string
      description: Placeholder text shown when the textarea is empty.

    - name: rows
      type: number
      description: Number of visible text rows.
      default: 3

    - name: maxLength
      type: number
      description: "Maximum number of characters allowed, counted as user-perceived
        characters: an emoji or flag sequence counts as one. When set, a
        character counter (current/max) is displayed inside the input container,
        anchored to the bottom-right beneath the text. Does not enforce the
        limit natively; when exceeded the counter turns red and shows a warning
        icon (a non-color cue), and screen-reader users hear the
        remaining/over-limit count announced. Consumers validating the limit
        should count with characterCount (exported from the package) so
        enforcement matches the displayed count."

    - name: hasAutoFocus
      type: boolean
      description: Automatically focuses the textarea on mount.
      default: false

    - name: autoComplete
      type: string
      description: The native autocomplete attribute, forwarded to the textarea
        unchanged. Does not affect the controlled value.


- name: TextInput
  category: Form
  introduction: Edits themed text with optional local state and native form serialization.
  properties:
    - name: label
      type: string
      description: "Label text for the input: always rendered for accessibility."

    - name: description
      type: string
      description: Description text displayed between the label and input.

    - name: name
      type: string
      description: Includes the themed control's value under this form submission name.

    - name: required
      type: boolean
      description: Requires a value before native form submission.

    - name: disabled
      type: boolean
      description: Prevents interaction and excludes the field from submission.

    - name: width
      type: string | number
      description: Width of the field (number = pixels, string used as-is, e.g.
        "100%"). Sizes the whole field (label, control, and status) so they stay
        aligned.

    - name: value
      type: string
      description: Current value of the input.

    - name: defaultValue
      type: string
      description: The defaultValue prop.

    - name: onChange
      type: "(value: string) => void"
      description: Callback fired when the input value changes.

    - name: placeholder
      type: string
      description: Placeholder text shown when the input is empty.

    - name: type
      type: '"text" | "password" | "email"'
      description: The HTML input type.
      default: text

    - name: size
      type: '"sm" | "md" | "lg"'
      description: Size variant of the input.
      default: md

    - name: autoComplete
      type: string
      description: The native autocomplete attribute, forwarded to the input
        unchanged. Does not affect the controlled value.

    - name: hasClear
      type: boolean
      description: Shows a clear (×) button when the input has a value. Clicking it
        clears the value and returns focus to the input.
      default: false

    - name: hasAutoFocus
      type: boolean
      description: Automatically focuses the input on mount.
      default: false

    - name: startIcon
      type: ReactNode
      description: SVG icon component displayed at the start of the input. See `astryx
        docs icons` for valid semantic names.

    - name: onEnter
      type: () => void
      description: "Callback fired when the user presses the Enter key. IME-safe:
        Enter used to commit a Japanese/Chinese/Korean conversion does not fire
        it."


- name: TimeInput
  category: Form
  introduction: Selects a constrained time using the standard picker.
  properties:
    - name: label
      type: string
      description: Label text for the input (required for accessibility).

    - name: description
      type: string
      description: Description text displayed between the label and input.

    - name: name
      type: string
      description: Includes the themed control's value under this form submission name.

    - name: required
      type: boolean
      description: Requires a value before native form submission.

    - name: disabled
      type: boolean
      description: Prevents interaction and excludes the field from submission.

    - name: width
      type: string | number
      description: Width of the field (number = pixels, string used as-is, e.g.
        "100%"). Sizes the whole field (label, control, and status) so they stay
        aligned.

    - name: value
      type: ISOTimeString
      description: Controlled time value in ISO format (HH:MM or HH:MM:SS).

    - name: defaultValue
      type: ISOTimeString
      description: The defaultValue prop.

    - name: onChange
      type: "(value: ISOTimeString | undefined) => void"
      description: Callback fired when the time changes. Receives undefined when the
        input is cleared.

    - name: min
      type: ISOTimeString
      description: Minimum selectable time in ISO format. Values outside the range are
        rejected.

    - name: max
      type: ISOTimeString
      description: Maximum selectable time in ISO format. Values outside the range are
        rejected.

    - name: hasSeconds
      type: boolean
      description: Includes seconds in the time display and parsing.
      default: false

    - name: hasClear
      type: boolean
      description: Shows a clear button when a value is set and the input is not disabled.
      default: false

    - name: hourFormat
      type: '"12h" | "24h"'
      description: Controls the display format. '12h' shows AM/PM (e.g. '2:30 PM');
        '24h' uses 24-hour notation (e.g. '14:30').
      default: 12h

    - name: increment
      type: number
      description: Number of minutes to add or subtract when the user presses the up
        or down arrow key.
      default: 1

    - name: placeholder
      type: string
      description: Placeholder text shown when no time is selected. When the input is
        focused and empty, a format hint overrides this text.
      default: Select a time

    - name: size
      type: '"sm" | "md" | "lg"'
      description: Controls the height of the input element.
      default: md


- name: Timestamp
  category: Display
  introduction: Formats a date or timestamp using the standard date formats.
  properties:
    - name: value
      type: string | number
      description: The date/time to display. Accepts Unix timestamps (seconds) or ISO
        8601 strings.

    - name: format
      type: '"date" | "date_long" | "date_weekday" | "date_time" | "time" | "relative"
        | "system_date" | "system_date_time" | "system_time"'
      description: Display format. 'relative' uses the locale's native long
        relative-time wording ('2 hours ago' in English), 'relative_short' uses
        its narrow pattern ('2h ago' in English) for compact surfaces, 'date'
        shows 'Mar 21, 2025', 'date_long' shows 'March 21, 2025', 'date_weekday'
        shows 'Wed, Mar 21, 2025', 'date_time' shows 'Mar 21, 2025, 2:51 PM',
        'time' shows '2:51 PM', 'system_*' variants use ISO-style formatting,
        'unix_seconds' shows the Unix time in whole seconds since the epoch (an
        absolute, zone-independent value), 'auto' switches from relative to
        date_time based on recency.
      default: date_time
