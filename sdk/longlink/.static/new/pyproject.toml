[project]
name = "longlink-app"
version = "0.0.0"
description = "Minimal LongLink office operations application."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "longlink",
  "python-multipart",
  "sqlmodel",
]

[tool.longlink]
environment = "src.envs:Env"

[dependency-groups]
dev = [
  "httpx2",
  "pytest",
  "pytest-asyncio",
  "ruff",
]

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
no-sections = true
length-sort = true

[tool.pytest.ini_options]
pythonpath = ["."]
