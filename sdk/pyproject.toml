[build-system]
requires = ["setuptools>=83.0.0", "setuptools-scm[toml]>=10.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "longlink"
dynamic = ["version"]
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "click>=8.4.2",
    "fastapi>=0.140.13",
    "fsspec>=2026.4.0",
    "lxml>=6.1.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "s3fs>=2026.4.0",
    "sqlalchemy>=2.0.51",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.51.0",
    "xmlschema>=4.3.2",
]
requires-python = ">=3.12"
authors = [
    {name = "LongLink SAGL", email = "info@longlink.ch"}
]
description = "Python SDK for building and packaging LongLink applications."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*"]
keywords = ["longlink", "sdk", "fastapi", "sqlalchemy", "pydantic", "alembic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ty>=0.0.64",
    "ruff>=0.16.1",
    "lxml-stubs>=0.5.1",
    "httpx2>=2.9.1",
]

[project.urls]
Homepage = "https://www.longlink.dev"
Documentation = "https://longlink.dev/docs"
Repository = "https://github.com/xLongLink/longlink.git"
"Bug Tracker" = "https://github.com/xLongLink/longlink/issues"

[tool.setuptools_scm]
root = ".."
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[project.scripts]
longlink = "longlink.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["longlink*"]

[tool.setuptools.package-data]
longlink = [".static/**"]
"longlink.shared" = ["alembic/*.py", "alembic/*.mako", "alembic/versions/*.py"]

[tool.setuptools.exclude-package-data]
longlink = [".static/new/.venv", ".static/new/.venv/*", ".static/new/.venv/**"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["UP", "D300", "I"]

[tool.ruff.lint.isort]
no-sections = true
length-sort = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: marks integration tests requiring Docker"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ty.src]
include = ["longlink", "tests"]
exclude = ["dev", "longlink/.static"]
