name: Setup Python
description: Install the Python and uv versions used by LongLink CI.

inputs:
    cache-dependency-glob:
        description: Files used to invalidate the uv cache.
        required: false
        default: '**/uv.lock'
    python-version:
        description: Python version to install.
        required: false
        default: '3.14.6'

runs:
    using: composite
    steps:
        - name: Setup uv
          uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
          with:
              enable-cache: true
              cache-dependency-glob: ${{ inputs.cache-dependency-glob }}
              version: '0.13.4'
              python-version: ${{ inputs.python-version }}
