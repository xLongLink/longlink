version: 2
updates:
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
      cooldown:
          default-days: 3
      groups:
          github-actions:
              patterns:
                  - '*'
              update-types:
                  - 'minor'
                  - 'patch'

    - package-ecosystem: 'uv'
      directories:
          - '/api'
          - '/sdk'
      schedule:
          interval: 'weekly'
      cooldown:
          default-days: 3
      groups:
          aws-storage:
              patterns:
                  - 'aiobotocore'
                  - 'botocore'
                  - 's3fs'
                  - 'fsspec'
              update-types:
                  - 'minor'
                  - 'patch'
          python-testing:
              patterns:
                  - 'pytest'
                  - 'pytest-asyncio'
                  - 'pytest-cov'
              update-types:
                  - 'minor'
                  - 'patch'
          python-database:
              patterns:
                  - 'sqlalchemy'
                  - 'sqlalchemy-utils'
                  - 'sqlmodel'
                  - 'alembic'
              update-types:
                  - 'minor'
                  - 'patch'
          python-validation:
              patterns:
                  - 'pydantic'
                  - 'pydantic-settings'
              update-types:
                  - 'minor'
                  - 'patch'
          python-build:
              patterns:
                  - 'setuptools'
                  - 'setuptools-scm'
              update-types:
                  - 'minor'
                  - 'patch'

    - package-ecosystem: 'bun'
      directory: '/web'
      schedule:
          interval: 'weekly'
      cooldown:
          default-days: 3
      groups:
          react:
              patterns:
                  - 'react'
                  - 'react-dom'
                  - '@types/react'
                  - '@types/react-dom'
              update-types:
                  - 'minor'
                  - 'patch'
          react-security:
              applies-to: security-updates
              patterns:
                  - 'react'
                  - 'react-dom'
          react-router:
              patterns:
                  - 'react-router'
                  - '@react-router/dev'
              update-types:
                  - 'minor'
                  - 'patch'
          tailwind:
              patterns:
                  - 'tailwindcss'
                  - '@tailwindcss/vite'
              update-types:
                  - 'minor'
                  - 'patch'
          vite-plus:
              patterns:
                  - 'vite'
                  - 'vite-plus'
                  - 'vitest'
                  - '@voidzero-dev/vite-plus-core'
              update-types:
                  - 'minor'
                  - 'patch'
          drag-and-drop:
              patterns:
                  - '@dnd-kit/*'
              update-types:
                  - 'minor'
                  - 'patch'
          avatars:
              patterns:
                  - '@dicebear/*'
              update-types:
                  - 'minor'
                  - 'patch'
          forms:
              patterns:
                  - 'react-hook-form'
                  - '@hookform/resolvers'
              update-types:
                  - 'minor'
                  - 'patch'

    - package-ecosystem: 'docker'
      directories:
          - '/api'
          - '/sdk/longlink/.static/docker'
      schedule:
          interval: 'weekly'
      cooldown:
          default-days: 3
      ignore:
          - dependency-name: 'python'
            update-types:
                - 'version-update:semver-major'
                - 'version-update:semver-minor'

    - package-ecosystem: 'docker-compose'
      directory: '/dev'
      schedule:
          interval: 'weekly'
      cooldown:
          default-days: 3

    - package-ecosystem: 'helm'
      directory: '/k8s/chart'
      schedule:
          interval: 'weekly'
      cooldown:
          default-days: 3
