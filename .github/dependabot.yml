version: 2
updates:
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'

    - package-ecosystem: 'uv'
      directories:
          - '/api'
          - '/sdk'
      schedule:
          interval: 'weekly'

    - package-ecosystem: 'bun'
      directory: '/web'
      schedule:
          interval: 'weekly'
      groups:
          react:
              patterns:
                  - 'react'
                  - 'react-dom'
          react-security:
              applies-to: security-updates
              patterns:
                  - 'react'
                  - 'react-dom'
          react-router:
              patterns:
                  - 'react-router'
                  - '@react-router/dev'
          astryx:
              patterns:
                  - '@astryxdesign/core'
                  - '@astryxdesign/cli'
          tailwind:
              patterns:
                  - 'tailwindcss'
                  - '@tailwindcss/vite'
          vite-plus:
              patterns:
                  - 'vite'
                  - 'vite-plus'
                  - '@voidzero-dev/vite-plus-core'

    - package-ecosystem: 'docker'
      directory: '/api'
      schedule:
          interval: 'weekly'

    - package-ecosystem: 'docker-compose'
      directory: '/dev'
      schedule:
          interval: 'weekly'

    - package-ecosystem: 'helm'
      directory: '/k8s/chart'
      schedule:
          interval: 'weekly'
