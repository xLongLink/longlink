version: 2
updates:
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
      cooldown:
          default-days: 3

    - package-ecosystem: 'uv'
      directories:
          - '/api'
          - '/sdk'
      schedule:
          interval: 'weekly'
      cooldown:
          default-days: 3
      groups:
          aws-storage:
              patterns:
                  - 'aiobotocore'
                  - 'botocore'
                  - 's3fs'
                  - 'fsspec'

    - package-ecosystem: 'bun'
      directory: '/web'
      schedule:
          interval: 'weekly'
      cooldown:
          default-days: 3
      groups:
          react:
              patterns:
                  - 'react'
                  - 'react-dom'
          react-types:
              patterns:
                  - '@types/react'
                  - '@types/react-dom'
          react-security:
              applies-to: security-updates
              patterns:
                  - 'react'
                  - 'react-dom'
          react-router:
              patterns:
                  - 'react-router'
                  - '@react-router/dev'
          astryx:
              patterns:
                  - '@astryxdesign/core'
                  - '@astryxdesign/cli'
          tailwind:
              patterns:
                  - 'tailwindcss'
                  - '@tailwindcss/vite'
          vite-plus:
              patterns:
                  - 'vite'
                  - 'vite-plus'
                  - '@voidzero-dev/vite-plus-core'

    - package-ecosystem: 'docker'
      directories:
          - '/api'
          - '/sdk/longlink/.static/docker'
      schedule:
          interval: 'weekly'
      cooldown:
          default-days: 3
      ignore:
          - dependency-name: 'python'
            update-types:
                - 'version-update:semver-major'
                - 'version-update:semver-minor'

    - package-ecosystem: 'docker-compose'
      directory: '/dev'
      schedule:
          interval: 'weekly'
      cooldown:
          default-days: 3

    - package-ecosystem: 'helm'
      directory: '/k8s/chart'
      schedule:
          interval: 'weekly'
      cooldown:
          default-days: 3
