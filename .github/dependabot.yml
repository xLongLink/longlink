version: 2
updates:
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'

    - package-ecosystem: 'uv'
      directories:
          - '/api'
          - '/sdk'
      schedule:
          interval: 'weekly'

    - package-ecosystem: 'bun'
      directory: '/web'
      schedule:
          interval: 'weekly'
      groups:
          react:
              patterns:
                  - 'react'
                  - 'react-dom'

    - package-ecosystem: 'docker'
      directory: '/api'
      schedule:
          interval: 'weekly'

    - package-ecosystem: 'docker-compose'
      directory: '/dev'
      schedule:
          interval: 'weekly'

    - package-ecosystem: 'helm'
      directory: '/k8s/chart'
      schedule:
          interval: 'weekly'
