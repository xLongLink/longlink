name: Trivy

on:
    push:
        branches: ['main']
    pull_request:
        branches: ['main']
    schedule:
        - cron: '36 17 * * 2'

permissions:
    contents: read

jobs:
    build:
        name: Scan API image
        runs-on: ubuntu-24.04
        timeout-minutes: 30

        permissions:
            contents: read
            security-events: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7.0.1

            # Build the same production image as the API image checks.
            - name: Set up Helm
              uses: azure/setup-helm@v5.1.0
              with:
                  version: v4.3.0

            - name: Package Compute chart
              run: helm package k8s/chart --version 0.0.0 --destination .

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v4.4.1

            - name: Build API image
              uses: docker/build-push-action@v7.4.0
              with:
                  context: .
                  file: api/Dockerfile
                  platforms: linux/amd64
                  load: true
                  push: false
                  tags: longlink-api:trivy
                  build-args: COMPUTE_ARCHIVE=longlink-0.0.0.tgz
                  cache-from: type=gha,scope=api
                  cache-to: type=gha,mode=max,scope=api

            - name: Install Trivy
              run: |
                  set -euo pipefail
                  archive="$RUNNER_TEMP/trivy.tar.gz"
                  curl --fail --location --output "$archive" https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz
                  printf '%s  %s\n' 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9 "$archive" | sha256sum --check --status
                  mkdir "$RUNNER_TEMP/trivy-bin"
                  tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/trivy-bin" trivy
                  printf '%s\n' "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"

            # Report high and critical vulnerabilities without publishing the image.
            - name: Run Trivy vulnerability scanner
              run: trivy image --format sarif --output trivy-results.sarif --scanners vuln --severity CRITICAL,HIGH --exit-code 0 longlink-api:trivy

            - name: Upload Trivy scan results to GitHub Security tab
              uses: github/codeql-action/upload-sarif@v4.39.3
              with:
                  sarif_file: trivy-results.sarif
