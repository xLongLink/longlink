name: Trivy

on:
    push:
        branches: ['main']
    pull_request:
        branches: ['main']
    schedule:
        - cron: '36 17 * * 2'

permissions:
    contents: read

jobs:
    build:
        name: Scan API image
        runs-on: ubuntu-24.04
        timeout-minutes: 30

        permissions:
            contents: read
            security-events: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7.0.1

            # Build the same production image as the API image checks.
            - name: Set up Helm
              uses: azure/setup-helm@v5.1.0
              with:
                  version: v4.3.0

            - name: Package Compute chart
              run: helm package k8s/chart --version 0.0.0 --destination .

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v4.4.1

            - name: Build API image
              uses: docker/build-push-action@v7.4.0
              with:
                  context: .
                  file: api/Dockerfile
                  platforms: linux/amd64
                  load: true
                  push: false
                  tags: longlink-api:trivy
                  build-args: COMPUTE_ARCHIVE=longlink-0.0.0.tgz
                  cache-from: type=gha,scope=api
                  cache-to: type=gha,mode=max,scope=api

            # Report high and critical vulnerabilities without publishing the image.
            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  image-ref: longlink-api:trivy
                  format: sarif
                  output: trivy-results.sarif
                  scanners: vuln
                  severity: CRITICAL,HIGH
                  limit-severities-for-sarif: true

            - name: Upload Trivy scan results to GitHub Security tab
              uses: github/codeql-action/upload-sarif@v4.39.3
              with:
                  sarif_file: trivy-results.sarif
