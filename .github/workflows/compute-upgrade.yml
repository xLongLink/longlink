name: Compute Upgrade

on:
    workflow_dispatch:
        inputs:
            compute-version:
                description: Previous stable Compute release tag
                required: true
                type: string

permissions:
    contents: read

jobs:
    upgrade:
        # Enable after the first stable Compute archive is published.
        if: vars.COMPUTE_UPGRADE_ENABLED == 'true'
        runs-on: blacksmith-4vcpu-ubuntu-2404
        timeout-minutes: 45

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup kubectl
              uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
              with:
                  version: v1.34.3

            - name: Setup Helm
              run: |
                  set -euo pipefail
                  curl --fail --location --output "$RUNNER_TEMP/helm.tar.gz" https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
                  mkdir "$RUNNER_TEMP/helm"
                  tar --extract --gzip --file "$RUNNER_TEMP/helm.tar.gz" --strip-components=1 --directory "$RUNNER_TEMP/helm" linux-amd64/helm
                  printf '%s\n' "$RUNNER_TEMP/helm" >> "$GITHUB_PATH"

            - name: Setup k3d
              run: |
                  set -euo pipefail
                  curl --fail --location --output "$RUNNER_TEMP/k3d" https://github.com/k3d-io/k3d/releases/download/v5.8.3/k3d-linux-amd64
                  mkdir "$RUNNER_TEMP/k3d-bin"
                  install --mode=755 "$RUNNER_TEMP/k3d" "$RUNNER_TEMP/k3d-bin/k3d"
                  printf '%s\n' "$RUNNER_TEMP/k3d-bin" >> "$GITHUB_PATH"

            - name: Create Compute cluster
              run: |
                  set -euo pipefail
                  k3d cluster create --config dev/cluster.yaml
                  k3d kubeconfig get compute > "$RUNNER_TEMP/compute-kubeconfig"
                  chmod 600 "$RUNNER_TEMP/compute-kubeconfig"
                  printf 'KUBECONFIG=%s\n' "$RUNNER_TEMP/compute-kubeconfig" >> "$GITHUB_ENV"

            - name: Download previous Compute package
              env:
                  GH_TOKEN: ${{ github.token }}
                  COMPUTE_VERSION: ${{ inputs.compute-version }}
              run: |
                  set -euo pipefail
                  gh release download "$COMPUTE_VERSION" --repo "$GITHUB_REPOSITORY" --pattern "longlink-compute-${COMPUTE_VERSION}.tgz" --dir "$RUNNER_TEMP"
                  tar --extract --gzip --file "$RUNNER_TEMP/longlink-compute-${COMPUTE_VERSION}.tgz" --directory "$RUNNER_TEMP"

            - name: Install previous Compute package
              env:
                  COMPUTE_VERSION: ${{ inputs.compute-version }}
              run: |
                  set -euo pipefail
                  helm upgrade --install longlink-compute "$RUNNER_TEMP/longlink-compute" --namespace rustfs --create-namespace --values "$RUNNER_TEMP/longlink-compute/values-development.yaml" --wait --wait-for-jobs --timeout 15m

            - name: Verify existing Knative Service
              run: |
                  set -euo pipefail
                  kubectl get secret longlink-gateway-tls --namespace knative-serving --output jsonpath='{.data.tls\.crt}' | base64 --decode > "$RUNNER_TEMP/gateway.crt"
                  kubectl apply --filename k8s/chart/tests/knative-service.yaml
                  kubectl wait --namespace default --for=condition=Ready --timeout=5m service.serving.knative.dev/compute-smoke
                  printf 'COMPUTE_SMOKE_UID=%s\n' "$(kubectl get --namespace default service.serving.knative.dev/compute-smoke --output jsonpath='{.metadata.uid}')" >> "$GITHUB_ENV"
                  curl --fail --silent --show-error --cacert "$RUNNER_TEMP/gateway.crt" --header 'Host: compute-smoke.default.svc.cluster.local' https://127.0.0.1:8443/

            - name: Upgrade Knative CRDs
              run: kubectl apply --server-side --force-conflicts --filename k8s/chart/crds

            - name: Upgrade Compute package
              run: |
                  set -euo pipefail
                  helm upgrade longlink-compute k8s/chart --namespace rustfs --values k8s/chart/values-development.yaml --wait --wait-for-jobs --timeout 15m

            - name: Verify Compute upgrade
              run: |
                  set -euo pipefail
                  test "$(helm list --namespace rustfs --filter '^longlink-compute$' --output json | jq --raw-output '.[0].revision')" = 2
                  test "$(kubectl get --namespace default service.serving.knative.dev/compute-smoke --output jsonpath='{.metadata.uid}')" = "$COMPUTE_SMOKE_UID"
                  kubectl wait --namespace default --for=condition=Ready --timeout=5m service.serving.knative.dev/compute-smoke
                  curl --fail --silent --show-error --cacert "$RUNNER_TEMP/gateway.crt" --header 'Host: compute-smoke.default.svc.cluster.local' https://127.0.0.1:8443/

            - name: Collect Compute diagnostics
              if: failure()
              run: |
                  kubectl get all --all-namespaces --output wide || true
                  kubectl get events --all-namespaces --sort-by=.lastTimestamp || true
                  kubectl describe deployment --namespace knative-serving controller webhook net-kourier-controller || true
                  kubectl describe deployment --namespace kourier-system 3scale-kourier-gateway || true
                  kubectl describe deployment --namespace cnpg-system cnpg-controller-manager || true

            - name: Delete Compute cluster
              if: always()
              run: k3d cluster delete compute
