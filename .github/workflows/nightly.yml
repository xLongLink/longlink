name: Publish Nightly

on:
    schedule:
        - cron: '17 2 * * *'
    workflow_dispatch:

permissions: {}

concurrency:
    group: nightly-api-image
    cancel-in-progress: false

jobs:
    tests:
        permissions:
            contents: read
        uses: ./.github/workflows/tests.yml

    publish-api-image:
        needs: tests
        runs-on: ubuntu-24.04
        timeout-minutes: 30

        environment:
            name: nightly

        outputs:
            platform_version: ${{ steps.platform.outputs.version }}

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Helm
              uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
              with:
                  version: v4.3.0

            - name: Resolve nightly Platform version
              id: platform
              run: |
                  set -euo pipefail

                  version="v$(date -u +'%Y.%-m.%-d')"

                  printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

            - name: Package nightly Compute chart
              id: compute
              run: |
                  set -euo pipefail

                  build="n$(date -u +'%Y.%m.%d')-${GITHUB_SHA}"
                  build_date="${build#n}"
                  build_date="${build_date%-*}"
                  chart_version="0.0.0-nightly-${build_date//./}-${build##*-}"
                  archive="longlink-${chart_version}.tgz"
                  helm package k8s/chart --version "$chart_version" --destination .
                  sha256sum "$archive" > "${archive}.sha256"
                  checksum="$(cut -d ' ' -f 1 "${archive}.sha256")"

                  {
                      echo "archive=$archive"
                      echo "chart_version=$chart_version"
                      echo "chart_sha256=$checksum"
                  } >> "$GITHUB_OUTPUT"

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Log in to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push nightly API image
              id: api
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: api/Dockerfile
                  platforms: linux/amd64
                  push: true
                  build-args: |
                      VERSION=${{ steps.platform.outputs.version }}
                      COMPUTE_ARCHIVE=${{ steps.compute.outputs.archive }}
                  labels: |
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.version=${{ steps.platform.outputs.version }}
                      longlink.dev/release-version=${{ steps.compute.outputs.chart_version }}
                      longlink.dev/release-compute-version=${{ steps.compute.outputs.chart_version }}
                      longlink.dev/release-compute-sha256=${{ steps.compute.outputs.chart_sha256 }}
                      longlink.dev/release-sdk-version=${{ steps.platform.outputs.version }}
                  annotations: |
                      index:org.opencontainers.image.description=LongLink backend API
                  tags: ghcr.io/xlonglink/longlink:nightly
                  cache-from: type=gha,scope=api
                  cache-to: type=gha,mode=max,scope=api

            - name: Remove old nightly Compute chart versions
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail

                  package=longlink
                  # A first publication has no package version history to prune.
                  if ! versions="$(gh api --paginate --slurp "orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${package}/versions?per_page=100" 2>&1)"; then
                      case "$versions" in
                          *'HTTP 404'*) exit 0 ;;
                          *) printf '%s\n' "$versions" >&2; exit 1 ;;
                      esac
                  fi

                  printf '%s\n' "$versions" \
                    | jq -r '[.[][] | select((.metadata.container.tags // []) | any(.[]; test("^0\\.0\\.0-nightly-[0-9]{8}-[0-9a-f]{40}$")))] | sort_by(.created_at) | reverse | .[3:][] | .id' \
                    | while IFS= read -r version_id; do
                        gh api --method DELETE "orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${package}/versions/$version_id"
                    done

    sync-sample:
        needs: publish-api-image
        permissions:
            contents: read
        uses: ./.github/workflows/sync-sample.yml
        with:
            channel: nightly
            version: ${{ needs.publish-api-image.outputs.platform_version }}
        secrets:
            SAMPLE_REPOSITORY_TOKEN: ${{ secrets.SAMPLE_REPOSITORY_TOKEN }}
