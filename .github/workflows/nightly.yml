name: Publish Nightly

on:
    schedule:
        - cron: '17 2 * * *'
    workflow_dispatch:

permissions: {}

concurrency:
    group: nightly-api-image
    cancel-in-progress: false

jobs:
    tests:
        permissions:
            contents: read
        uses: ./.github/workflows/tests.yml

    compute-setup:
        permissions:
            contents: read
        uses: ./.github/workflows/compute-setup.yml

    publish-api-image:
        needs: [tests, compute-setup]
        runs-on: ubuntu-24.04
        timeout-minutes: 30

        environment:
            name: nightly

        outputs:
            platform_version: ${{ steps.platform.outputs.version }}
            publish: ${{ steps.release.outputs.publish }}

        permissions:
            contents: write
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Resolve nightly Platform version
              id: platform
              run: |
                  set -euo pipefail

                  version="v$(date -u +'%Y.%-m.%-d')"
                  release="n$(date -u +'%Y.%m.%d')-${GITHUB_SHA::12}"

                  printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
                  printf 'release=%s\n' "$release" >> "$GITHUB_OUTPUT"

            - name: Check nightly release
              id: release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE: ${{ steps.platform.outputs.release }}
              run: |
                  set -euo pipefail

                  publish=true
                  if gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                      publish=false
                      printf 'Nightly release %s already exists.\n' "$RELEASE"
                  fi

                  printf 'publish=%s\n' "$publish" >> "$GITHUB_OUTPUT"

            - name: Setup Docker Buildx
              if: steps.release.outputs.publish == 'true'
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

            - name: Log in to GHCR
              if: steps.release.outputs.publish == 'true'
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push nightly API image
              id: image
              if: steps.release.outputs.publish == 'true'
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  file: api/Dockerfile
                  platforms: linux/amd64
                  push: true
                  build-args: |
                      VERSION=${{ steps.platform.outputs.version }}
                  labels: |
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.version=${{ steps.platform.outputs.version }}
                  annotations: |
                      index:org.opencontainers.image.description=LongLink backend API
                  tags: ghcr.io/xlonglink/longlink-nightly:${{ steps.platform.outputs.release }}
                  cache-from: type=gha,scope=api
                  cache-to: type=gha,mode=max,scope=api

            - name: Package nightly Compute
              if: steps.release.outputs.publish == 'true'
              env:
                  IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
                  RELEASE: ${{ steps.platform.outputs.release }}
              run: |
                  set -euo pipefail

                   archive="longlink-compute-${RELEASE}.tgz"
                   make package-compute COMPUTE_VERSION="$RELEASE" ARCHIVE="$archive"

                  checksum="$(cut -d ' ' -f 1 "${archive}.sha256")"
                  jq --null-input \
                    --arg archive "$archive" \
                    --arg checksum "$checksum" \
                    --arg compute "$RELEASE" \
                    --arg image "ghcr.io/xlonglink/longlink-nightly@${IMAGE_DIGEST}" \
                    --arg release "$RELEASE" \
                    '{release: $release, image: $image, compute: {version: $compute, archive: $archive, sha256: $checksum}}' \
                    > "longlink-nightly-${RELEASE}.json"

            - name: Publish nightly release
              if: steps.release.outputs.publish == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE: ${{ steps.platform.outputs.release }}
              run: |
                  set -euo pipefail

                   archive="longlink-compute-${RELEASE}.tgz"
                  gh release create "$RELEASE" \
                    --repo "$GITHUB_REPOSITORY" \
                    --target "$GITHUB_SHA" \
                    --title "$RELEASE" \
                    --notes "Immutable nightly Platform and Compute build for ${GITHUB_SHA}." \
                    --prerelease \
                    "$archive" \
                    "${archive}.sha256" \
                    "longlink-nightly-${RELEASE}.json"

            - name: Remove old nightly API image versions
              if: steps.release.outputs.publish == 'true'
              uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
              with:
                  package-name: longlink-nightly
                  package-type: container
                  min-versions-to-keep: 3
                  delete-only-untagged-versions: false

            - name: Remove old nightly releases
              if: steps.release.outputs.publish == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail

                  gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                    --jq '[.[] | select(.prerelease and (.tag_name | test("^n[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}-[0-9a-f]{12}$")))] | sort_by(.published_at) | reverse | .[3:][] | .tag_name' \
                    > "$RUNNER_TEMP/old-nightly-releases"

                  while IFS= read -r release; do
                      gh release delete "$release" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
                  done < "$RUNNER_TEMP/old-nightly-releases"

    sync-sample:
        needs: publish-api-image
        if: needs.publish-api-image.outputs.publish == 'true'
        permissions:
            contents: read
        uses: ./.github/workflows/sync-sample.yml
        with:
            channel: nightly
            version: ${{ needs.publish-api-image.outputs.platform_version }}
        secrets:
            SAMPLE_REPOSITORY_TOKEN: ${{ secrets.SAMPLE_REPOSITORY_TOKEN }}
