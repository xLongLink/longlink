name: Nightly Image

on:
    schedule:
        - cron: '17 2 * * *'
    workflow_dispatch:

permissions: {}

concurrency:
    group: nightly-api-image
    cancel-in-progress: true

jobs:
    tests:
        permissions:
            contents: read
        uses: ./.github/workflows/tests.yml

    publish-api-image:
        needs: tests
        runs-on: ubuntu-latest

        outputs:
            platform_version: ${{ steps.platform.outputs.version }}

        env:
            IMAGE: ghcr.io/xlonglink/longlink:nightly

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Resolve nightly Platform version
              id: platform
              run: |
                  set -euo pipefail

                  version="v$(date -u +'%Y.%-m.%-d')"
                  printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

            - name: Log in to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Check current nightly image
              id: nightly
              env:
                  PLATFORM_VERSION: ${{ steps.platform.outputs.version }}
              run: |
                  set -euo pipefail

                  image="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Image}}' 2>/dev/null || true)"
                  revision="$(jq -r '.config.Labels["org.opencontainers.image.revision"] // empty' <<< "$image")"
                  version="$(jq -r '[.config.Env[]? | select(startswith("VERSION=")) | ltrimstr("VERSION=")][0] // empty' <<< "$image")"
                  publish=true
                  if [ "$revision" = "$GITHUB_SHA" ] && [ "$version" = "$PLATFORM_VERSION" ]; then
                      publish=false
                      printf 'The nightly image already contains commit %s with Platform version %s.\n' "$GITHUB_SHA" "$PLATFORM_VERSION"
                  fi

                  printf 'publish=%s\n' "$publish" >> "$GITHUB_OUTPUT"

            - name: Build and push nightly API image
              if: steps.nightly.outputs.publish == 'true'
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  file: api/Dockerfile
                  push: true
                  build-args: |
                      VERSION=${{ steps.platform.outputs.version }}
                  labels: |
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.version=${{ steps.platform.outputs.version }}
                  annotations: |
                      index:org.opencontainers.image.description=LongLink backend API
                  tags: ${{ env.IMAGE }}

            - name: Remove old nightly API image versions
              uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
              with:
                  package-name: longlink
                  package-type: container
                  min-versions-to-keep: 3
                  delete-only-untagged-versions: true

    sync-sample:
        needs: publish-api-image
        permissions:
            contents: read
        uses: ./.github/workflows/sync-sample.yml
        with:
            channel: nightly
            version: ${{ needs.publish-api-image.outputs.platform_version }}
        secrets: inherit
