name: OpenCode Change

on:
  workflow_dispatch:
    inputs:
      model:
        description: Free OpenCode model to use
        required: true
        default: opencode/nemotron-3.5-lightning-free
        type: choice
        options:
          - opencode/big-pickle
          - opencode/hy3-free
          - opencode/mimo-v2.5-free
          - opencode/muse-spark-1.2-contributor-free
          - opencode/nemotron-3-ultra-free
          - opencode/nemotron-3.5-lightning-free
          - opencode/x-preview-f-free

jobs:
  opencode:
    name: Make changes and create PR
    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:
      id-token: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git author
        run: |
          git config user.name "longlink-bot"
          git config user.email "bot@longlink.dev"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          # OpenCode Zen key.
          # The selected model itself is free.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

          # Built-in GitHub Actions token used to push the branch
          # and create the pull request.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        with:
          model: ${{ inputs.model }}

          # Use GitHub Actions' GITHUB_TOKEN instead of
          # requiring the OpenCode GitHub App.
          use_github_token: true
          agent: cleanup
          prompt: Execute one high cleanup task.
