name: OpenCode Change

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Describe the change OpenCode should make"
        required: true
        type: string

jobs:
  opencode:
    name: Make changes and create PR
    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          # OpenCode Zen key.
          # The selected model itself is free.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

          # Built-in GitHub Actions token used to push the branch
          # and create the pull request.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        with:
          # Free, open-source/open-weight model
          model: opencode/mimo-v2.5-free

          # Use GitHub Actions' GITHUB_TOKEN instead of
          # requiring the OpenCode GitHub App.
          use_github_token: true

          prompt: |
            Make the following change to this repository:

            ${{ inputs.prompt }}

            Requirements:
            - Inspect the existing codebase before making changes.
            - Implement the requested change completely.
            - Follow the existing architecture, style, and conventions.
            - Do not make unrelated changes.
            - Run relevant tests, linters, formatters, and type checks.
            - Fix failures caused by your changes.
            - Do not modify generated or vendored files unless necessary.
            - Create a new branch for the implementation.
            - Commit all changes with a clear commit message.
            - Push the branch to the repository.
            - Open a pull request against the repository's default branch.

            The pull request must include:
            - A concise title.
            - A summary of the implementation.
            - The reason for the changes.
            - Tests/checks that were run.
            - Any important implementation notes.