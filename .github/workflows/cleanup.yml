name: OpenCode Change

on:
  workflow_dispatch:

jobs:
  opencode:
    name: Make changes and create PR
    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          # OpenCode Zen key.
          # The selected model itself is free.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

          # Built-in GitHub Actions token used to push the branch
          # and create the pull request.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        with:
          # Free Nemotron 3.5 Lightning model
          model: opencode/nemotron-3.5-lightning-free

          # Use GitHub Actions' GITHUB_TOKEN instead of
          # requiring the OpenCode GitHub App.
          use_github_token: true
          agent: cleanup
          prompt: Execute one high cleanup task.
