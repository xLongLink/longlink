name: Sync Sample

on:
    workflow_call:
        inputs:
            channel:
                required: true
                type: string
            version:
                required: true
                type: string
        secrets:
            SAMPLE_REPOSITORY_TOKEN:
                required: true
    workflow_dispatch:
        inputs:
            channel:
                description: Sample branch to replace
                required: true
                default: main
                type: choice
                options: [main, nightly]
            version:
                description: Sample release version
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: sync-sample-${{ inputs.channel }}
    cancel-in-progress: false

jobs:
    sync:
        runs-on: ubuntu-24.04
        timeout-minutes: 20

        environment:
            name: ${{ inputs.channel == 'main' && 'release' || 'nightly' }}

        env:
            SYNC_CHANNEL: ${{ inputs.channel }}
            SAMPLE_VERSION: ${{ inputs.version }}

        steps:
            - name: Checkout LongLink
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Python
              uses: ./.github/actions/setup-python
              with:
                  cache-dependency-glob: sdk/uv.lock

            - name: Generate scaffold
              run: |
                  set -euo pipefail
                  uv sync --locked --project sdk
                  uv run --locked --project sdk longlink init --folder "$RUNNER_TEMP/sample" --ci github
                  perl -0pi -e 's/^version = "0\.0\.0"$/version = "$ENV{SAMPLE_VERSION}"/m' "$RUNNER_TEMP/sample/pyproject.toml"

                  if [ "$SYNC_CHANNEL" = main ]; then
                      sdk_version="${SAMPLE_VERSION#v}"
                      SDK_VERSION="$sdk_version" perl -0pi -e 's/"longlink"/"longlink==$ENV{SDK_VERSION}"/' "$RUNNER_TEMP/sample/pyproject.toml"
                  fi

                  for attempt in 1 2 3 4 5; do
                      if uv lock --project "$RUNNER_TEMP/sample"; then
                          break
                      fi
                      if [ "$attempt" = 5 ]; then
                          exit 1
                      fi
                      sleep 10
                  done

            - name: Validate scaffold
              run: |
                  set -euo pipefail

                  uv sync --locked --project "$RUNNER_TEMP/sample" --group dev
                  uv run --locked --project "$RUNNER_TEMP/sample" ruff check .
                  uv run --locked --project "$RUNNER_TEMP/sample" pytest

            - name: Build scaffold image
              working-directory: ${{ runner.temp }}/sample
              run: uv run --locked longlink build --tag ci

            - name: Replace sample history
              env:
                  SAMPLE_REPOSITORY_TOKEN: ${{ secrets.SAMPLE_REPOSITORY_TOKEN }}
                  GH_TOKEN: ${{ secrets.SAMPLE_REPOSITORY_TOKEN }}
              run: |
                  set -euo pipefail
                  : "${SAMPLE_REPOSITORY_TOKEN:?Set the SAMPLE_REPOSITORY_TOKEN repository secret.}"

                  case "$SYNC_CHANNEL" in
                      main|nightly) sample_branch="$SYNC_CHANNEL" ;;
                      *)
                          printf 'Unsupported sample branch: %s\n' "$SYNC_CHANNEL" >&2
                          exit 1
                          ;;
                  esac

                  gh auth setup-git
                  git clone https://github.com/xlongLink/sample.git sample
                  cd sample
                  git switch --orphan scaffold
                  git rm -rf --ignore-unmatch .
                  git clean -ffdx
                  cp -a "$RUNNER_TEMP/sample/." .
                  git add --all
                  git -c user.name="longlink-bot" -c user.email="bot@longlink.dev" commit -m "chore: sync LongLink scaffold"
                  git push --force origin "HEAD:${sample_branch}"

                  # Recreate the release so its workflow publishes the newly synchronized image.
                  if gh release view "$SAMPLE_VERSION" >/dev/null 2>&1; then
                      gh release delete "$SAMPLE_VERSION" --yes --cleanup-tag
                  fi
                  gh release create "$SAMPLE_VERSION" --target "$sample_branch" --title "$SAMPLE_VERSION" --generate-notes
