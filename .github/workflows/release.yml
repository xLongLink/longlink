name: Release

on:
    push:
        tags:
            - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    validate-release:
        runs-on: ubuntu-24.04
        timeout-minutes: 5

        permissions:
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Verify release commit
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  set -euo pipefail

                  if ! git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" "origin/${DEFAULT_BRANCH}"; then
                      printf 'Release tag must point to a commit on %s.\n' "$DEFAULT_BRANCH" >&2
                      exit 1
                  fi

    tests:
        needs: validate-release
        permissions:
            contents: read
        uses: ./.github/workflows/tests.yml

    # The SDK is published to PyPI.
    publish-sdk:
        needs: tests
        runs-on: ubuntu-24.04
        timeout-minutes: 20

        environment:
            name: release

        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  fetch-tags: true

            - name: Setup Python
              uses: ./.github/actions/setup-python
              with:
                  cache-dependency-glob: sdk/uv.lock

            - name: Setup Vite+
              uses: ./.github/actions/setup-vite

            - name: Build web assets for SDK
              working-directory: web
              run: vp run build:sdk --logLevel warn
              env:
                  VERSION: ${{ github.ref_name }}

            - name: Build SDK distribution
              working-directory: sdk
              run: uv build

            - name: Publish to PyPI
              working-directory: sdk
              run: uv publish --trusted-publishing automatic

    # The API is packaged into a container, so we will publish the image to GHCR on each release.
    publish-api-image:
        needs: tests
        runs-on: ubuntu-24.04
        timeout-minutes: 30

        environment:
            name: release

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

            - name: Log in to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push API image
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  file: api/Dockerfile
                  push: true
                  build-args: |
                      VERSION=${{ github.ref_name }}
                  annotations: |
                      index:org.opencontainers.image.description=LongLink backend API
                  tags: ghcr.io/xlonglink/longlink:${{ github.ref_name }}
                  cache-from: type=gha,scope=api
                  cache-to: type=gha,mode=max,scope=api

    sync-sample:
        needs: [publish-sdk, publish-api-image]
        permissions:
            contents: read
        uses: ./.github/workflows/sync-sample.yml
        with:
            channel: main
            version: ${{ github.ref_name }}
        secrets:
            SAMPLE_REPOSITORY_TOKEN: ${{ secrets.SAMPLE_REPOSITORY_TOKEN }}

    publish-github-release:
        needs: [publish-sdk, publish-api-image, sync-sample]
        runs-on: ubuntu-24.04
        timeout-minutes: 10

        environment:
            name: release

        permissions:
            contents: write

        steps:
            - name: Create GitHub release
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
              with:
                  tag_name: ${{ github.ref_name }}
                  name: ${{ github.ref_name }}
                  generate_release_notes: true
