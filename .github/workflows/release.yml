name: Release

on:
    push:
        tags:
            - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    validate-release:
        runs-on: ubuntu-24.04
        timeout-minutes: 5

        permissions:
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0

            - name: Verify release commit
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  set -euo pipefail

                  if ! git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" "origin/${DEFAULT_BRANCH}"; then
                      printf 'Release tag must point to a commit on %s.\n' "$DEFAULT_BRANCH" >&2
                      exit 1
                  fi

    tests:
        needs: validate-release
        permissions:
            contents: read
        uses: ./.github/workflows/tests.yml

    # The SDK is published to PyPI.
    publish-sdk:
        needs: tests
        runs-on: ubuntu-24.04
        timeout-minutes: 20

        environment:
            name: release

        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 1
                  fetch-tags: true

            - name: Setup Python
              uses: astral-sh/setup-uv@v9.0.0
              with:
                  enable-cache: true
                  cache-dependency-glob: sdk/uv.lock
                  version: '0.13.4'
                  python-version: '3.14.6'

            - name: Setup Vite+
              uses: voidzero-dev/setup-vp@v1.15.0
              with:
                  cache: true
                  node-version-file: package.json
                  run-install: |
                      args: ['--frozen-lockfile']
                  working-directory: web

            - name: Build web assets for SDK
              working-directory: web
              run: vp run build:sdk:bundle --logLevel warn
              env:
                  VERSION: ${{ github.ref_name }}

            - name: Build SDK distribution
              working-directory: sdk
              run: uv build

            - name: Publish to PyPI
              working-directory: sdk
              run: uv publish --trusted-publishing automatic

            - name: Wait for SDK on PyPI
              run: |
                  set -euo pipefail

                  version="${GITHUB_REF_NAME#v}"
                  for attempt in $(seq 1 30); do
                      if curl --fail --silent --show-error "https://pypi.org/pypi/longlink/${version}/json" >/dev/null; then
                          exit 0
                      fi
                      sleep 10
                  done

                  printf 'longlink %s was not available on PyPI within five minutes.\n' "$version" >&2
                  exit 1

    # Publish the matching Compute chart both as an OCI artifact and inside the API image.
    publish-api-image:
        needs: tests
        runs-on: ubuntu-24.04
        timeout-minutes: 30

        environment:
            name: release

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7.0.1

            - name: Set up Helm
              uses: azure/setup-helm@v5.1.0
              with:
                  version: v4.3.0

            - name: Package Compute chart
              id: compute
              run: |
                  set -euo pipefail

                  version="${GITHUB_REF_NAME#v}"
                  archive="longlink-${version}.tgz"
                  helm package k8s/chart --version "$version" --destination .
                  checksum="$(sha256sum "$archive" | cut -d ' ' -f 1)"

                  {
                      echo "version=$version"
                      echo "archive=$archive"
                      echo "sha256=$checksum"
                  } >> "$GITHUB_OUTPUT"

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v4.4.1

            - name: Log in to GHCR
              uses: docker/login-action@v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push API image
              uses: docker/build-push-action@v7.4.0
              with:
                  context: .
                  file: api/Dockerfile
                  platforms: linux/amd64
                  push: true
                  build-args: |
                      VERSION=${{ github.ref_name }}
                      COMPUTE_ARCHIVE=${{ steps.compute.outputs.archive }}
                  annotations: |
                      index:org.opencontainers.image.description=LongLink backend API
                  labels: |
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.version=${{ github.ref_name }}
                      longlink.dev/release-version=${{ github.ref_name }}
                      longlink.dev/release-compute-version=${{ steps.compute.outputs.version }}
                      longlink.dev/release-compute-sha256=${{ steps.compute.outputs.sha256 }}
                      longlink.dev/release-sdk-version=${{ github.ref_name }}
                  tags: |
                      ghcr.io/xlonglink/longlink:${{ github.ref_name }}
                      ghcr.io/xlonglink/longlink:latest
                  cache-from: type=gha,scope=api
                  cache-to: type=gha,mode=max,scope=api

            - name: Push Compute chart to GHCR
              env:
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail

                  printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
                  helm push "${{ steps.compute.outputs.archive }}" oci://ghcr.io/xlonglink

    sync-sample:
        needs: [publish-sdk, publish-api-image]
        permissions:
            contents: read
        uses: ./.github/workflows/sync-sample.yml
        with:
            version: ${{ github.ref_name }}
        secrets:
            SAMPLE_REPOSITORY_TOKEN: ${{ secrets.SAMPLE_REPOSITORY_TOKEN }}

    publish-github-release:
        needs: sync-sample
        runs-on: ubuntu-24.04
        timeout-minutes: 10

        environment:
            name: release

        permissions:
            contents: write

        steps:
            - name: Create GitHub release
              uses: softprops/action-gh-release@v3.0.4
              with:
                  tag_name: ${{ github.ref_name }}
                  name: ${{ github.ref_name }}
                  generate_release_notes: true
