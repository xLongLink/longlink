name: Release

on:
    push:
        tags:
            - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    validate-release:
        runs-on: ubuntu-24.04
        timeout-minutes: 5

        permissions:
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Verify release commit
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  set -euo pipefail

                  if ! git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" "origin/${DEFAULT_BRANCH}"; then
                      printf 'Release tag must point to a commit on %s.\n' "$DEFAULT_BRANCH" >&2
                      exit 1
                  fi

    tests:
        needs: validate-release
        permissions:
            contents: read
        uses: ./.github/workflows/tests.yml

    # The SDK is published to PyPI.
    publish-sdk:
        needs: tests
        runs-on: ubuntu-24.04
        timeout-minutes: 20

        environment:
            name: release

        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1
                  fetch-tags: true

            - name: Setup Python
              uses: ./.github/actions/setup-python
              with:
                  cache-dependency-glob: sdk/uv.lock

            - name: Setup Vite+
              uses: ./.github/actions/setup-vite

            - name: Build web assets for SDK
              working-directory: web
              run: vp run build:sdk:bundle --logLevel warn
              env:
                  VERSION: ${{ github.ref_name }}

            - name: Build SDK distribution
              working-directory: sdk
              run: uv build

            - name: Publish to PyPI
              working-directory: sdk
              run: uv publish --trusted-publishing automatic

            - name: Wait for SDK on PyPI
              run: |
                  set -euo pipefail

                  version="${GITHUB_REF_NAME#v}"
                  for attempt in $(seq 1 30); do
                      if curl --fail --silent --show-error "https://pypi.org/pypi/longlink/${version}/json" >/dev/null; then
                          exit 0
                      fi
                      sleep 10
                  done

                  printf 'longlink %s was not available on PyPI within five minutes.\n' "$version" >&2
                  exit 1

    # The API image embeds the matching Compute chart, so GHCR holds a single release artifact.
    publish-api-image:
        needs: tests
        runs-on: ubuntu-24.04
        timeout-minutes: 30

        outputs:
            image: ghcr.io/xlonglink/longlink@${{ steps.image.outputs.digest }}

        environment:
            name: release

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Helm
              uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
              with:
                  version: v4.3.0

            - name: Package Compute chart
              id: compute
              run: |
                  set -euo pipefail

                  version="${GITHUB_REF_NAME#v}"
                  archive="longlink-${version}.tgz"
                  helm package k8s/chart --version "$version" --app-version "$GITHUB_REF_NAME" --destination .
                  sha256sum "$archive" > "${archive}.sha256"

                  {
                      echo "version=$version"
                      echo "archive=$archive"
                      echo "sha256=$(cut -d ' ' -f 1 "${archive}.sha256")"
                  } >> "$GITHUB_OUTPUT"

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

            - name: Log in to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push API image
              id: image
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  file: api/Dockerfile
                  platforms: linux/amd64
                  push: true
                  build-args: |
                      VERSION=${{ github.ref_name }}
                      COMPUTE_ARCHIVE=${{ steps.compute.outputs.archive }}
                  annotations: |
                      index:org.opencontainers.image.description=LongLink backend API
                  labels: |
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.version=${{ github.ref_name }}
                      longlink.dev/release-version=${{ github.ref_name }}
                      longlink.dev/release-compute-version=${{ steps.compute.outputs.version }}
                      longlink.dev/release-compute-sha256=${{ steps.compute.outputs.sha256 }}
                      longlink.dev/release-sdk-version=${{ github.ref_name }}
                  tags: |
                      ghcr.io/xlonglink/longlink:${{ github.ref_name }}
                      ghcr.io/xlonglink/longlink:latest
                  cache-from: type=gha,scope=api
                  cache-to: type=gha,mode=max,scope=api

    sync-sample:
        needs: [publish-sdk, publish-api-image]
        permissions:
            contents: read
        uses: ./.github/workflows/sync-sample.yml
        with:
            channel: main
            version: ${{ github.ref_name }}
        secrets:
            SAMPLE_REPOSITORY_TOKEN: ${{ secrets.SAMPLE_REPOSITORY_TOKEN }}

    publish-github-release:
        needs: [publish-sdk, publish-api-image, sync-sample]
        runs-on: ubuntu-24.04
        timeout-minutes: 10

        environment:
            name: release

        permissions:
            contents: write

        steps:
            - name: Create GitHub release
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
              with:
                  tag_name: ${{ github.ref_name }}
                  name: ${{ github.ref_name }}
                  generate_release_notes: true
