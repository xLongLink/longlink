name: Tests

on:
    pull_request:
    workflow_dispatch:
    workflow_call:

permissions:
    contents: read

jobs:
    # The API is packaged into a container, so test it on the supported Python runtime.
    api-tests:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Python environment
              uses: ./.github/actions/setup-python

            - name: Setup web environment
              uses: ./.github/actions/setup-vite

            - name: Install dependencies
              working-directory: api
              run: uv sync --locked --extra dev

            - name: Check API formatting
              working-directory: api
              run: uv run --locked ruff check .

            - name: Check Platform API client generation
              working-directory: web
              run: vp run check:platform-api

            - name: Build API web bundle
              working-directory: web
              run: vp run build:api:bundle --logLevel warn

            - name: Run tests
              working-directory: api
              run: uv run --locked pytest tests

            - name: Run type checks
              working-directory: api
              run: uv run --locked --extra dev ty check

    # The SDK requires Python 3.12 or newer.
    sdk-tests:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Python environment
              uses: ./.github/actions/setup-python

            - name: Setup web environment
              uses: ./.github/actions/setup-vite

            - name: Install dependencies
              working-directory: sdk
              run: uv sync --locked --group dev

            - name: Check SDK formatting
              working-directory: sdk
              run: uv run --locked ruff check .

            - name: Build SDK web bundle
              working-directory: web
              run: vp run build:sdk:bundle --logLevel warn

            - name: Run tests
              working-directory: sdk
              run: uv run --locked pytest tests

            - name: Run type checks
              working-directory: sdk
              run: uv run --locked --group dev ty check

            - name: Build SDK distribution
              working-directory: sdk
              run: uv build

    # The web package uses Vite+ and Bun, so run its checks separately.
    web-tests:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup web environment
              uses: ./.github/actions/setup-vite

            - name: Check web formatting
              working-directory: web
              run: vp run check

            - name: Run tests
              working-directory: web
              run: vp run test

            - name: Run type checks
              working-directory: web
              run: vp run typecheck
