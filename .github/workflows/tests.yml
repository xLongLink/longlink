name: Tests

on:
    pull_request:
    push:
        branches:
            - main
    merge_group:
    workflow_dispatch:
    workflow_call:

permissions:
    contents: read

concurrency:
    group: tests-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    # The API is packaged into a container, so test it on the supported Python runtime.
    api-tests:
        runs-on: ubuntu-24.04
        timeout-minutes: 30

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Python environment
              uses: ./.github/actions/setup-python
              with:
                  cache-dependency-glob: api/uv.lock

            - name: Setup web environment
              uses: ./.github/actions/setup-vite

            - name: Install dependencies
              working-directory: api
              run: uv sync --locked --extra dev

            - name: Setup kubectl for Compute package checks
              uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
              with:
                  version: v1.35.4

            - name: Lint API
              working-directory: api
              run: uv run --locked ruff check .

            - name: Setup Helm
              run: |
                  set -euo pipefail
                  curl --fail --location --output "$RUNNER_TEMP/helm.tar.gz" https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
                  mkdir "$RUNNER_TEMP/helm"
                  tar --extract --gzip --file "$RUNNER_TEMP/helm.tar.gz" --strip-components=1 --directory "$RUNNER_TEMP/helm" linux-amd64/helm
                  printf '%s\n' "$RUNNER_TEMP/helm" >> "$GITHUB_PATH"

            - name: Render Compute package
              run: |
                  set -euo pipefail
                  helm lint k8s/chart --values k8s/chart/values-development.yaml
                  helm template longlink-compute k8s/chart --namespace rustfs --values k8s/chart/values-development.yaml > /dev/null

            - name: Verify Docker daemon
              run: docker info

            - name: Check Platform API client generation
              working-directory: web
              run: vp run check:platform-api

            - name: Build API web bundle
              working-directory: web
              run: vp run build:api:bundle --logLevel warn

            - name: Run tests
              working-directory: api
              run: uv run --locked pytest tests --cov=main --cov=src --cov-report=term-missing

            - name: Run type checks
              working-directory: api
              run: uv run --locked --extra dev ty check

    # Exercise the Compute package against the same disposable K3s topology used locally.
    compute-e2e:
        runs-on: blacksmith-4vcpu-ubuntu-2404
        timeout-minutes: 35

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup kubectl
              uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
              with:
                  version: v1.34.3

            - name: Setup Helm
              run: |
                  set -euo pipefail
                  curl --fail --location --output "$RUNNER_TEMP/helm.tar.gz" https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
                  mkdir "$RUNNER_TEMP/helm"
                  tar --extract --gzip --file "$RUNNER_TEMP/helm.tar.gz" --strip-components=1 --directory "$RUNNER_TEMP/helm" linux-amd64/helm
                  printf '%s\n' "$RUNNER_TEMP/helm" >> "$GITHUB_PATH"

            - name: Setup k3d
              run: |
                  set -euo pipefail
                  curl --fail --location --output "$RUNNER_TEMP/k3d" https://github.com/k3d-io/k3d/releases/download/v5.8.3/k3d-linux-amd64
                  mkdir "$RUNNER_TEMP/k3d-bin"
                  install --mode=755 "$RUNNER_TEMP/k3d" "$RUNNER_TEMP/k3d-bin/k3d"
                  printf '%s\n' "$RUNNER_TEMP/k3d-bin" >> "$GITHUB_PATH"

            - name: Create Compute cluster
              run: |
                  set -euo pipefail
                  k3d cluster create --config dev/cluster.yaml
                  k3d kubeconfig get compute > "$RUNNER_TEMP/compute-kubeconfig"
                  chmod 600 "$RUNNER_TEMP/compute-kubeconfig"
                  printf 'KUBECONFIG=%s\n' "$RUNNER_TEMP/compute-kubeconfig" >> "$GITHUB_ENV"

            - name: Install Compute package
              run: |
                  set -euo pipefail
                  helm upgrade --install longlink-compute k8s/chart --namespace rustfs --create-namespace --values k8s/chart/values-development.yaml --wait --wait-for-jobs --timeout 15m

            - name: Verify Compute controllers
              run: |
                  set -euo pipefail
                  kubectl wait --for=condition=Established --timeout=5m customresourcedefinition/services.serving.knative.dev
                  kubectl wait --for=condition=Established --timeout=5m customresourcedefinition/clusters.postgresql.cnpg.io
                  kubectl wait --namespace knative-serving --for=condition=Available --timeout=5m deployment/controller deployment/webhook deployment/net-kourier-controller
                  kubectl wait --namespace kourier-system --for=condition=Available --timeout=5m deployment/3scale-kourier-gateway
                  kubectl wait --namespace cnpg-system --for=condition=Available --timeout=5m deployment/cnpg-controller-manager
                  kubectl wait --namespace rustfs --for=condition=Available --timeout=5m deployment/rustfs deployment/longlink-storage
                  test "$(kubectl get configmap compute-release --namespace longlink-system --output jsonpath='{.data.contract}')" = 1

            - name: Verify Compute HTTPS endpoints
              run: |
                  set -euo pipefail
                  kubectl get secret longlink-gateway-tls --namespace knative-serving --output jsonpath='{.data.tls\.crt}' | base64 --decode > "$RUNNER_TEMP/gateway.crt"
                  kubectl get secret longlink-storage-tls --namespace rustfs --output jsonpath='{.data.tls\.crt}' | base64 --decode > "$RUNNER_TEMP/storage.crt"
                  curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 --cacert "$RUNNER_TEMP/gateway.crt" --header 'Host: internalkourier' https://127.0.0.1:8443/ready
                  curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 --cacert "$RUNNER_TEMP/storage.crt" --resolve storage.localhost:9443:127.0.0.1 --output /dev/null https://storage.localhost:9443/health/ready

            - name: Verify Knative Service
              run: |
                  set -euo pipefail
                  kubectl apply --filename k8s/chart/tests/knative-service.yaml
                  kubectl wait --namespace default --for=condition=Ready --timeout=5m service.serving.knative.dev/compute-smoke
                  curl --fail --silent --show-error --cacert "$RUNNER_TEMP/gateway.crt" --header 'Host: compute-smoke.default.svc.cluster.local' https://127.0.0.1:8443/

            - name: Collect Compute diagnostics
              if: failure()
              run: |
                  kubectl get all --all-namespaces --output wide || true
                  kubectl get events --all-namespaces --sort-by=.lastTimestamp || true
                  kubectl describe deployment --namespace knative-serving controller webhook net-kourier-controller || true
                  kubectl describe deployment --namespace kourier-system 3scale-kourier-gateway || true
                  kubectl describe deployment --namespace cnpg-system cnpg-controller-manager || true

            - name: Delete Compute cluster
              if: always()
              run: k3d cluster delete compute

    # The SDK requires Python 3.12 or newer.
    sdk-tests:
        name: SDK tests (Python ${{ matrix.python-version }})
        runs-on: ubuntu-24.04
        timeout-minutes: 30

        strategy:
            fail-fast: false
            matrix:
                python-version: ['3.12.13', '3.13.11', '3.14.6']

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Python environment
              uses: ./.github/actions/setup-python
              with:
                  cache-dependency-glob: sdk/uv.lock
                  python-version: ${{ matrix.python-version }}

            - name: Setup web environment
              uses: ./.github/actions/setup-vite

            - name: Install dependencies
              working-directory: sdk
              run: uv sync --locked --group dev

            - name: Lint SDK
              working-directory: sdk
              run: uv run --locked ruff check .

            - name: Verify Docker daemon
              run: docker info

            - name: Build SDK web bundle
              working-directory: web
              run: vp run build:sdk:bundle --logLevel warn

            - name: Run tests
              working-directory: sdk
              run: uv run --locked pytest tests --cov --cov-report=term-missing

            - name: Run type checks
              working-directory: sdk
              run: uv run --locked --group dev ty check

            - name: Build SDK distribution
              if: matrix.python-version == '3.14.6'
              working-directory: sdk
              run: uv build

            - name: Smoke test SDK wheel
              if: matrix.python-version == '3.14.6'
              working-directory: sdk
              run: uv run --isolated --no-project --with ./dist/*.whl python -c "from importlib.resources import files; assert files('longlink').joinpath('.static/web/index.html').is_file()"

    # Build the production image independently so publishing cannot discover Docker-only failures.
    api-image:
        runs-on: ubuntu-24.04
        timeout-minutes: 30

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

            - name: Build API image
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  file: api/Dockerfile
                  platforms: linux/amd64
                  load: true
                  push: false
                  tags: longlink-api:test
                  cache-from: type=gha,scope=api
                  cache-to: type=gha,mode=max,scope=api

            - name: Smoke test API image
              run: |
                  set -euo pipefail

                  container=longlink-api-smoke
                  trap 'docker logs longlink-api-smoke || true; docker rm --force longlink-api-smoke >/dev/null 2>&1 || true' EXIT

                  docker run --detach --name "$container" --publish 127.0.0.1:18000:8000 \
                      --env SMTP_HOST=smtp.example.com \
                      --env SESSION_KEY=ci-session-key-with-at-least-32-characters \
                      --env ADMIN_NAME=Administrator \
                      --env ADMIN_EMAIL=administrator@example.com \
                      --env ADMIN_PASSWORD=ci-password \
                      --env ENCRYPTION_KEY=ci-encryption-key-with-at-least-32-characters \
                      --env DATABASE_URL=sqlite+aiosqlite:////tmp/longlink.db \
                      longlink-api:test \
                      sh -c 'alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 8000'

                  for _ in {1..60}; do
                      if curl --fail --silent http://127.0.0.1:18000/api/v1/readyz >/dev/null; then
                          exit 0
                      fi
                      sleep 1
                  done

                  exit 1

    # The web package uses Vite+ and Bun, so run its checks separately.
    web-tests:
        runs-on: ubuntu-24.04
        timeout-minutes: 20

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup web environment
              uses: ./.github/actions/setup-vite

            - name: Check web formatting
              working-directory: web
              run: vp run check

            - name: Run tests
              working-directory: web
              run: vp run test

            - name: Run type checks
              working-directory: web
              run: vp run typecheck
