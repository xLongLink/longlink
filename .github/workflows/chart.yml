name: Refresh CloudNativePG chart

on:
    schedule:
        - cron: '23 7 * * 1'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: refresh-cloudnative-pg-chart
    cancel-in-progress: false

jobs:
    refresh:
        runs-on: ubuntu-24.04
        timeout-minutes: 15

        permissions:
            actions: write
            contents: write
            pull-requests: write

        steps:
            - name: Checkout default branch
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  persist-credentials: false

            - name: Set up Helm
              uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
              with:
                  version: v4.3.0

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Refresh and validate vendored chart
              env:
                  TMPDIR: ${{ runner.temp }}
              run: python3 .github/scripts/chart.py

            - name: Open update pull request
              id: pull-request
              uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
              with:
                  token: ${{ github.token }}
                  branch: automation/cloudnative-pg-chart
                  delete-branch: true
                  author: longlink-bot <bot@longlink.dev>
                  committer: longlink-bot <bot@longlink.dev>
                  commit-message: 'chore: refresh vendored CloudNativePG chart'
                  title: 'chore: refresh vendored CloudNativePG chart'
                  labels: improvement
                  body: |
                      Refresh the full vendored chart from the official CloudNativePG Helm repository, preserving self-contained packaging and pinning the matching operator image by digest.

                      Validation: helm lint, helm template with the matching immutable operator image, and helm package without dependency downloads. Existing checks must pass before merging.
                  add-paths: |
                      k8s/chart/Chart.yaml
                      k8s/chart/values.yaml
                      k8s/chart/charts/cloudnative-pg

            - name: Run checks on the update branch
              if: steps.pull-request.outputs.pull-request-operation == 'created' || steps.pull-request.outputs.pull-request-operation == 'updated'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh workflow run tests.yml --ref automation/cloudnative-pg-chart
