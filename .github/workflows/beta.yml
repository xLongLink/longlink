name: Publish Beta

on:
    push:
        tags:
            - 'v*.*.*-beta.*'

permissions: {}

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    validate-release:
        runs-on: ubuntu-24.04
        timeout-minutes: 5

        permissions:
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Verify beta tag and commit
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  set -euo pipefail

                  if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta\.[1-9][0-9]*$ ]]; then
                      printf 'Expected a tag such as v0.5.0-beta.1.\n' >&2
                      exit 1
                  fi

                  if ! git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" "origin/${DEFAULT_BRANCH}"; then
                      printf 'Beta tag must point to a commit on %s.\n' "$DEFAULT_BRANCH" >&2
                      exit 1
                  fi

    tests:
        needs: validate-release
        permissions:
            contents: read
        uses: ./.github/workflows/tests.yml

    publish-sdk:
        needs: tests
        runs-on: ubuntu-24.04
        timeout-minutes: 20

        environment:
            name: release

        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1
                  fetch-tags: true

            - name: Setup Python
              uses: ./.github/actions/setup-python
              with:
                  cache-dependency-glob: sdk/uv.lock

            - name: Setup Vite+
              uses: ./.github/actions/setup-vite

            - name: Build web assets for SDK
              working-directory: web
              run: vp run build:sdk:bundle --logLevel warn
              env:
                  VERSION: ${{ github.ref_name }}

            - name: Build SDK distribution
              working-directory: sdk
              run: uv build

            - name: Publish beta SDK to PyPI
              working-directory: sdk
              run: uv publish --trusted-publishing automatic

            - name: Wait for beta SDK on PyPI
              run: |
                  set -euo pipefail

                  version="${GITHUB_REF_NAME#v}"
                  version="${version/-beta./b}"
                  for attempt in $(seq 1 30); do
                      if curl --fail --silent --show-error "https://pypi.org/pypi/longlink/${version}/json" >/dev/null; then
                          exit 0
                      fi
                      sleep 10
                  done

                  printf 'longlink %s was not available on PyPI within five minutes.\n' "$version" >&2
                  exit 1

    publish-artifacts:
        needs: tests
        runs-on: ubuntu-24.04
        timeout-minutes: 30

        environment:
            name: release

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Helm
              uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
              with:
                  version: v4.3.0

            - name: Package beta Compute chart
              id: compute
              run: |
                  set -euo pipefail

                  version="${GITHUB_REF_NAME#v}"
                  archive="longlink-${version}.tgz"
                  helm package k8s/chart --version "$version" --destination .
                  checksum="$(sha256sum "$archive" | cut -d ' ' -f 1)"

                  {
                      echo "version=$version"
                      echo "archive=$archive"
                      echo "sha256=$checksum"
                  } >> "$GITHUB_OUTPUT"

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Log in to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push beta API image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: api/Dockerfile
                  platforms: linux/amd64
                  push: true
                  build-args: |
                      VERSION=${{ github.ref_name }}
                      COMPUTE_ARCHIVE=${{ steps.compute.outputs.archive }}
                  annotations: |
                      index:org.opencontainers.image.description=LongLink backend API
                  labels: |
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.version=${{ github.ref_name }}
                      longlink.dev/release-version=${{ github.ref_name }}
                      longlink.dev/release-compute-version=${{ steps.compute.outputs.version }}
                      longlink.dev/release-compute-sha256=${{ steps.compute.outputs.sha256 }}
                  tags: ghcr.io/xlonglink/longlink:${{ github.ref_name }}
                  cache-from: type=gha,scope=api
                  cache-to: type=gha,mode=max,scope=api

            - name: Push beta Compute chart to GHCR
              env:
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail

                  printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
                  helm push "${{ steps.compute.outputs.archive }}" oci://ghcr.io/xlonglink

    sync-sample:
        needs: [publish-sdk, publish-artifacts]
        permissions:
            contents: read
        uses: ./.github/workflows/sync-sample.yml
        with:
            channel: beta
            version: ${{ github.ref_name }}
        secrets:
            SAMPLE_REPOSITORY_TOKEN: ${{ secrets.SAMPLE_REPOSITORY_TOKEN }}

    publish-github-release:
        needs: [publish-sdk, publish-artifacts, sync-sample]
        runs-on: ubuntu-24.04
        timeout-minutes: 10

        environment:
            name: release

        permissions:
            contents: write

        steps:
            - name: Create GitHub pre-release
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
              with:
                  tag_name: ${{ github.ref_name }}
                  name: ${{ github.ref_name }}
                  prerelease: true
                  make_latest: false
                  generate_release_notes: true
